const PRD_URL="https://www.notion.so/peerplay/Game-Center-Google-Play-332c2344a7dc81f4999bf63a6e39c5fa";
const PRD="\nRekated: \\| \n\n---\n## Brief\n\n---\n# 1. Overview & Goals\n**Platforms:** iOS (Game Center), Android (Google Play Games Services)\nThe game automatically and silently connects users to their platform account and uses it to back up and restore progress. The flow is **mostly frictionless**, with two intentional interruptions: (a) version out-of-range forces a **mandatory update** (no decline option), and (b) a login on another device forces the prior device to re-login to resume.\n\n	**Model change (April 2026).** This PRD replaces the previous progress-based comparison model (chapter → credits → timestamp → cloud wins) with a **single-state, last-write-wins model driven by a login check**. All comparison logic, state archival of “losing” saves, and dismissible-play-locally paths are removed. See Section 5 for the ownership rule and Section 13 for the full scenario matrix (including which logics are kept vs. removed).\n\n\n	**Design review pending.** New popup copy / UI (forced update popup, “Another device is logged in” popup) needs to be reviewed with **Dean** before implementation.\n\n### Goals\n- Prevent loss of user progress across devices and reinstalls\n- Improve user trust and retention\n- Eliminate login and restore friction\n- Provide a stable foundation for future platform features (achievements, leaderboards)\n---\n# 2. Scope\n### In Scope (MVP)\n- Automatic silent login on app launch\n- Platform account binding (platform_id ↔ distinct_id)\n- Cloud save and restore using a **single-state, last-write-wins** model — no state comparison\n- **Login check on app open / return from background.** Newer login wins; older device (in case active) is prompted to re-login to get the last known progress\n- One-time sync confirmation toast + signed-in toast on background return (return from background equals game login)\n- **Version range enforcement.** If installed version is not in the supported range: **forced update popup** — the user MUST update. No \"No\" button, no decline option, no disconnect path. The popup blocks gameplay until the user updates.\n- **Feature flag** (\`cloud_save_enabled\`): server-side on/off kill switch for the entire cloud save feature. When off, the feature is invisible to all users (no bind, no sync, no toasts).\n- Session ownership via heartbeat (one device at a time). No heartbeat while playing → offline toast: **\"No internet connection. Your progress may be lost.\"** Retries; on reconnect the device reconnects and saves.\n- Corrupted save detection and fallback (R&D to define recovery logic)\n- Reinstall recovery (skip FTUE, restore server state)\n- Platform disconnect handling (OS-level sign-out) → new distinct_id; re-binding requires support\n- Full analytics and logging\n- Admin restore tooling\n### Out of Scope (post MVP)\n- Platform account switching (signing into a **different** Game Center / Google Play account) — **POST MVP**\n- Manual login/logout\n- Cross-platform account merging (iOS ↔ Android)\n- Facebook / Apple Connect integration\n- Achievements, leaderboards, social features\n- Onboarding or forced login messaging\n---\n# 3. Core Design Principles\n\n	**Single server state.** The server holds exactly one state per user — the last state saved by the currently logged-in device. No state comparison, no chapter/credits/timestamp tiebreakers, no \"losing state\" archival. The login check (Section 5) decides who owns the state next.\n\n\n	**Login check — newer login wins.** When a second device logs in, the server swaps ownership to the new device. The previous device, on return, sees **\"****Another device is logged in — re-login to get your last known progress.\"** The UI shows up to **2 connected devices**.\n\n\n	**One device at a time.** Only the device holding the active session (heartbeat) saves. A new login on another device immediately transfers ownership; the old device stops saving and must re-login on return.\n\n\n	**Invisible by design — with two intentional interruptions.** No login screens, no buttons, no settings in the normal path. The only UI:\n	- **Sync toast** (one-time) — confirms progress is synced\n	- **Signed-in toast** (1 sec) — brief confirmation on return from background\n	- **Forced update popup** — installed version is out of the supported range. **No decline option.** Only button: \"Update Now\" → opens store. Popup blocks gameplay until updated.\n	- **Offline toast** (\"No internet connection. Your progress may be lost.\") — mid-session connectivity loss; retries silently; reconnects and saves on recovery\n	- **\"Another device is logged in\" popup** — shown on the older-login device to force re-login before play resumes\n\n\n	**Removed from scope.** The following logics from prior drafts are intentionally removed (see Section 13 matrix): state comparison by chapter, credits, or progress metrics; archival of losing states; dismissible update prompt / \"Are you sure?\" / disconnect-on-decline path; heartbeat ping-pong re-login loops; cloud vs. local tiebreakers; segmentation (no \`segment_id\` — single config for all users).\n\n---\n# 4. Architecture Overview\n\n	The sync system is built on one principle: **the server holds the single source of truth — one state per user, overwritten on every save by the currently logged-in device.** Devices never compare states. On app open / return from background the device runs a **login check**; if the device no longer owns the session (because a newer login has claimed it), the device must re-login before it can play or save.\n\n## 4.1 State Model\nEvery game state saved to the server includes:\n\n\n**Field**\n**Type**\n**Description**\n\n\n\`distinct_id\`\nString\nInternal user ID\n\n\n\`state_blob\`\nBinary (MessagePack)\nFull serialized game state. **MessagePack format** — forward-compatible: new fields always have default values, old clients ignore unknown fields.\n\n\n\`checksum\`\nString\nSHA-256 of state_blob — corruption detection\n\n\n\`timestamp\`\nDatetime\n**Server-assigned timestamp** on every save. Used for **409 conflict detection** on concurrent writes (expected vs actual timestamp) and to determine session recency during login check. Replaces the previous \`sequence_number\` field. **NOT used for state comparison** (comparison is removed — last-write-wins).\n\n\n\`chapter\`, \`scape_task_id\`, \`tasks_completed\`, \`credits_balance\`, \`metapoints_balance\`\nVarious\n**Logged for analytics only.** Not used for state comparison (removed). Present inside \`state_blob\` as gameplay data.\n\n\n\`version\`\nString\nVersion that created this save\n\n\n\`max_supported_chapter\`\nInteger\nHighest chapter this version supports. Prevents downgrade overwrites.\n\n\n**\`state_version_id\`**\nInteger\n**The state version bucket this app version belongs to** (see Section 6.1). Looked up from \`state_version_buckets\` config at login. If this doesn’t match the server’s \`current_state_version_id\`, the device must update or disconnect.\n\n\n\`state_schema_version\`\nInteger\nSchema version of this state blob. Used for migration checks (Section 6.5). Incremented only on breaking schema changes. Old clients ignore unknown fields; new clients use defaults for missing fields.\n\n\n## 4.2 Server Tables\n\n\n**Table**\n**Purpose**\n**Key**\n\n\n\`active_states\`\n**One row per user — the only canonical state.** Overwritten on every save. No history, no archival.\n\`distinct_id\`\n\n\n\`platform_bindings\`\nMaps platform_id → distinct_id. Tracks the set of devices currently connected to the platform account (drives the **2-devices indicator**).\n\`platform_id\`\n\n\n\`session_locks\`\nActive session heartbeat + \`current_login_device_id\`. A new login on another device overwrites this row — older device must re-login on return.\n\`distinct_id\`\n\n\n\`device_id_history\`\nAll distinct_ids used on each device. For restoring previous ID on platform disconnect.\n\`device_id\`  • \`distinct_id\`\n\n\n\`device_activity\`\nTracks \`last_server_activity\` per device — updated on ANY server interaction (events, API calls, analytics, heartbeat). **Server-side timestamps only.** Useful for monitoring and support investigations.\n\`device_id\`\n\n\n## 4.3 Key Architectural Rules\n1. **Server is the source of truth — one state per user.** The server stores exactly one state per user. Devices always load server state on login, never compare local vs. cloud.\n2. **Last write wins.** The currently logged-in (session-owning) device writes; each write overwrites the server state. No comparison, no tiebreakers, no chapter / credits / timestamp / sequence-number resolution.\n3. **\`timestamp\`**** is for concurrent-write conflict detection and login recency only** — not for state comparison. Server-assigned on every save.\n4. **Login check on every app open / background return.** If another device logged in more recently, the current device shows the \"Another device is logged in\" popup and must re-login to resume.\n5. **One active session at a time.** Heartbeat identifies the owning device. A new login transfers ownership; the old device stops saving.\n6. **Checksums on everything.** Every state blob is SHA-256 validated before loading.\n7. **Forward-compatible state blobs.** The state_blob schema MUST be forward-compatible: new fields always have default values, old clients ignore unknown fields. This eliminates the need for version pool changes in most cases. Breaking schema changes (field type changes, field removals, core restructuring) should be rare (1-2x/year) and require bumping \`cloud_save_min_version\`. Compatible changes (new fields with defaults, new optional features, new enum values) require NO config change.\n**Compatible change examples (NO min-version bump):**\n- Adding \`daily_challenges\` field → default \`null\` (old client ignores it, new client initializes fresh)\n- Adding \`metapoints_balance\` field → default \`0\` (old client ignores it, new client starts at 0)\n- Adding new item_ids to inventory catalog → old client can't render them but this triggers the update prompt (Section 6.2), not a schema break\n**Breaking change examples (REQUIRES min-version bump):**\n- Changing \`board_state\` from flat array to nested object → old client crashes on parse\n- Removing \`credits_balance\` field (renamed to \`currency\`) → old client can't find expected field\n- New Items \n- New feature \n- Restructuring chapter data model → old client can't deserialize\n- etc\n\n	**Immediate save triggers**\nChapter, balance, board task, purchase, milestone, Rewards, background\n\n---\n# 5. Ownership Rule\n\n	**This section replaces the prior \"State Comparison Rule\".** \nThere is no more chapter / credits / progress-based comparison. The model is: **one state on the server, last writer wins, newer login owns the state. ****\`timestamp\`**** (server-assigned) is used only for conflict detection and login recency, not for comparing game progress.**\n\n### 5.1 The rule\n1. The server stores **one active state** per user.\n2. Only the device that owns the **active session** (holds the heartbeat + current login) may save. Saves overwrite the server state.\n3. When a device opens the app or returns from background, it runs a **login check**:\n	- **Device is still the session owner** → load server state, continue playing, save as normal.\n	- **Another device has logged in since** → show **\"Another device is logged in — re-login to get your last known progress\"** popup. Player must re-login to claim the session back. Once claimed, server state is loaded and gameplay resumes.\n4. When a device logs in, it **takes over** ownership: the server marks this device as the current session holder. The previous owner, on its next open / background return, sees the popup.\n5. No local-vs-cloud comparison, ever. The server state is authoritative; whichever device wrote it last is what the next logged-in device plays.\n### 5.2 Example — offline + second-device takeover\n\`\`\`plain text\nT0: Device A is playing, session owner, at some state S_A. Writes S_A to server.\nT1: Device A loses connectivity. Client stops receiving heartbeat acks.\n    → Toast: \"No internet connection. Your progress may be lost.\"\n    → Client retries silently. Local play continues but is NOT synced.\nT2: Device B opens. Runs login check. Server session is still Device A's but Device A\n    has not heartbeat for > session_stale_threshold → Device B claims the session.\n    Device B loads S_A from server and continues playing, writing S_B1, S_B2, …\nT3: Device A's network returns. Client attempts to reconnect.\n    Login check: session owner is now Device B.\n    → Popup: \"Another device is logged in. Re-login to get your last known progress.\"\n    Player re-logs in → Device A claims session → loads latest server state (S_Bn) → plays.\n    Local progress Device A made while offline is DISCARDED (not uploaded, not compared).\n\`\`\`\n---\n# 6. Version Management\n\n	**This section defines the supported version range and the forced update flow.** If the installed version is outside the supported range, the user **must update**. There is no decline option, no disconnect path, and no \"play locally\" path. The forced update popup blocks gameplay until the user updates.\n\n## 6.1 State Version Bucketing (Server-Side)\nApp versions are grouped into **state version buckets**. All versions in the same bucket share the same state schema and can sync freely. When the server-side \`current_state_version_id\` is bumped, devices on older buckets must update.\n\n	**Core rule:** If Device A’s \`state_version_id\` ≠ the server’s \`current_state_version_id\`, the device sees the **Update or Disconnect** flow (Section 6.2).\n\n### Configuration\n\n\n**Parameter**\n**Type**\n**Description**\n**Example**\n\n\n\`state_version_buckets\`\nMap (server-side config)\nMaps app versions to a \`state_version_id\`. All app versions sharing the same ID have compatible state schemas.\n\`{ \"0.38.200\": 1, \"0.38.210\": 1, \"0.38.220\": 1, \"0.38.300\": 2 }\`\n\n\n\`current_state_version_id\`\nInteger (server-side config)\nThe state version ID that is currently required. Any device whose app version maps to a **different** state_version_id must update or disconnect.\n\`2\`\n\n\n\`cloud_save_excluded_versions\`\nArray of String (optional)\nSpecific versions to exclude (e.g., known-broken builds). Rarely used.\n\`[\"0.38.050\"]\`\n\n\n### How it works\n1. Every app version is mapped to a \`state_version_id\` in \`state_version_buckets\` (server-side config, no code deploy)\n2. The server maintains a \`current_state_version_id\` — the active bucket\n3. On every login / background return, the client checks: does my app version’s \`state_version_id\` match \`current_state_version_id\`?\n4. **Match** → normal cloud save\n5. **Mismatch** → Update or Disconnect flow (Section 6.2)\n6. **App version not in the map at all** (very old build) → same as mismatch\n### Example\n\`\`\`plain text\nServer config:\n  state_version_buckets: { \"0.38.200\": 1, \"0.38.210\": 1, \"0.38.220\": 1, \"0.38.300\": 2, \"0.38.310\": 2 }\n  current_state_version_id: 1\n\nDevice A on v0.38.210 → state_version_id = 1 → matches current (1) → ✅ normal sync\nDevice B on v0.38.220 → state_version_id = 1 → matches current (1) → ✅ normal sync\nDevice C on v0.38.300 → state_version_id = 2 → does NOT match current (1) → ✅ also fine\n  (Device C is on a newer bucket — it can sync because it’s forward-compatible)\n\nLater, server bumps: current_state_version_id: 2\n  (a breaking schema change shipped in v0.38.300)\n\nDevice A on v0.38.210 → state_version_id = 1 → does NOT match current (2)\n  → ❌ Update Popup shown: \"Update Available\" → must update to v0.38.300+ or disconnect\nDevice B on v0.38.220 → same as A → ❌ Update Popup\nDevice C on v0.38.300 → state_version_id = 2 → matches current (2) → ✅ normal sync\n\`\`\`\n### When the player’s version is outside all buckets\n- **Never-connected players:** Feature invisible. No toast. They don’t know cloud save exists.\n- **Previously-connected players:** Update or Disconnect flow (Section 6.2). They ALWAYS get the prompt.\n### Silent vs Update Prompt — When the player was previously connected\n\n	**Key rule:** If the installed version is out of the supported range, the player sees a **forced update popup** with only an \"Update Now\" button. No decline option. \n\nSilent (no UI) behavior only applies to players who **never connected** to cloud save on any device — they simply don't see the feature at all.\n\n\n\n**Condition**\n**Was previously connected?**\n**What happens**\n\n\nVersion out of range, **never connected**\nNo\n**Silent.** Feature invisible. No popup, no badge, no toast. Player doesn't know cloud save exists.\n\n\nVersion out of range, **was connected before**\nYes\n**Forced update popup shown.** Only \"Update Now\" button. No decline. Blocks gameplay until updated.\n\n\nVersion in \`cloud_save_excluded_versions\`, **was connected**\nYes\nSame as above. Server alert also fires (likely config mistake).\n\n\nVersion in \`cloud_save_excluded_versions\`, **never connected**\nNo\n**Silent.** Feature invisible.\n\n\n### Login Scenarios by Version\n\n\n**Scenario**\n**Behavior**\n\n\nAll devices in supported range\nNormal sync — single-state, last-write-wins, login-check ownership (Section 5)\n\n\nOnly current device (A) in range\nA runs normal login check / save; B will see update prompt when opened\n\n\nOnly other device (B) in range + A is out of range\nA (was connected): **forced update popup**. A (never connected): **silent** — feature unavailable.\n\n\nDevice version out of supported range\nWas connected: **forced update popup** (Section 6.2). Never connected: **silent**.\n\n\n## 6.1b Silent Disconnect Protection\n\n	**With the forced update flow, there is no path to disconnection from a version mismatch.** The user must update — the popup blocks all gameplay. Silent disconnect only applies to users who never connected.\n\n### Layer 1 — Prevention: Supported range is configured server-side\nNew versions should be added to the supported range at ship time. A newer version that is accidentally outside the range is treated as a config mistake: the player sees the update prompt immediately on open.\n### Layer 2 — Detection: Server-side alert on excluded newer version\nWhen the server receives a login from a device whose version is newer than the configured range (almost always a config mistake):\n1. Fires \`technical_cloud_save_version_disconnected\` BI event\n2. Triggers an alert to the team (Slack / PagerDuty)\n3. The player is routed to the Section 6.2 forced update flow. The team can correct the range server-side, after which the player no longer sees the prompt on next open.\n### Layer 3 — Data protection: Single state + support recovery\nBecause the server holds only one state and never runs comparison, there is nothing to overwrite incorrectly. If a player declines the update and is disconnected, the original cloud state is preserved on the server and can be re-bound to the device by support.\n---\n## 6.2 Forced Update — Version Out of Range\nTriggered when the installed version’s \`state_version_id\` ≠ \`current_state_version_id\`. The user **must update**. There is no decline option, no disconnect path, no “play locally” path.\n### 6.2.1 Flow\n1. **Forced Update popup** shown (blocking — no dismiss, no X, no tap-outside):\n	- Header: **\"Update Required\"**\n	- Body: **\"A new version is required to continue playing. Update now to keep your progress synced.\"**\n	- Single button: **\"Update Now\"** → opens App Store / Play Store\n2. **\"Update Now\"** → store opens. After updating, the app relaunches in the supported range → normal login / sync resumes.\n3. If the user closes the store without updating and returns to the game → **the forced update popup is shown again**. The popup persists on every app open / BG return until the version matches.\n	- Header: **TBD**\n	- Body: **TBD** (copy to be finalized with Dean). Must clearly state: (a) declining will disconnect the device from Game Center / Google Play, (b) a new account will be started on this device, (c) reconnecting the original cloud save will require contacting support.\n	- Buttons: **\"Yes, disconnect\"** / **\"Back\"**\n4. **\"Back\"** → returns to step 1 (update prompt stays).\n5. **\"Yes, disconnect\"** → the device is **disconnected from the platform account**:\n	- Server drops this device from \`platform_bindings\` (or marks it disconnected) — the platform account remains usable on other devices.\n	- Client clears platform linkage, generates a **new ****\`distinct_id\`**, and continues as a fresh guest account on this device. Gameplay is **local + DB only** (existing pre-cloud-save behavior).\n	- Shown once: **\"You have been disconnected from Game Center / Google Play. To reconnect your progress, please contact support.\"** (copy TBD with Dean).\n	- BI: \`technical_cloud_save_version_declined_disconnect\` fired.\n6. **Reconnect path** → **support-assisted only**. The client does NOT auto-reattempt binding after a version-decline disconnect. Support can re-bind the device's new \`distinct_id\` to the platform account via the admin restore tool.\n### 6.2.2 Why disconnect instead of \"play locally\"\nThe previous design allowed the player to keep playing locally while sync paused, then resume sync after updating — which required state comparison, risked diverged states, and led to the complex progress-based comparison that is now removed. \nWith a **single-state / last-write-wins** model there is no way to safely hold a device offline-but-bound; disconnecting cleanly avoids divergence, keeps the server state intact for the user's other devices, and makes the decision explicit.\n## 6.3 Soft Update — In-App Update Prompt (Separate System)\nThe  is a **separate, independent system** controlled via Firebase Remote Config:\n\n\n**Key**\n**Type**\n**Purpose**\n\n\n\`update_prompt_enabled\`\nBoolean\nGlobal kill switch\n\n\n\`update_prompt_min_version\`\nString\nusers below this see the soft prompt\n\n\n\`update_prompt_target_version\`\nString\nShown in dialog copy\n\n\n\`update_prompt_cooldown_hours\`\nNumber\nHours between re-prompts (default: 24)\n\n\nThis is **soft** (dismissible, with cooldown). user can tap \"Later.\"\n## 6.4 Priority & Interaction\n\n\n**Condition**\n**Which Prompt**\n**Behavior**\n\n\nVersion out of supported range\n**Forced update popup**\n**Forced update.** Only \"Update Now\" button. No decline option. Blocks gameplay until updated. Re-shown on every open / BG return.\n\n\nVersion is outdated but still in supported range\n**Soft in-app update prompt**\nDismissible. Cooldown-based. \"Later\" button. Does not affect cloud save.\n\n\n**Both** conditions true\n**Cloud save prompt takes priority**\nCloud save prompt shown first (more urgent — the player must update or disconnect). Soft prompt suppressed until version is back in range.\n\n\n## 6.5 State Schema Migration\nWhen loading a cloud save, the system checks \`state_schema_version\`:\n- **Server schema older** → Run migration transform to convert state to current schema. If migration fails, treat as corrupted (fallback chain). BI event \`technical_cloud_save_schema_migration\` sent.\n- **Server schema newer than app understands** → App is outdated. Route to **Section 6.2 forced update flow** (no decline option).\n- **Schemas match** → Continue normally.\n---\n# 7. User Flows — Step-by-Step with UI\n\`\`\`mermaid\nflowchart TD\n    FF{cloud_save_enabled?} -->|Off| XX[Feature invisible]\n    FF -->|On| A[App Opens]\n    A --> B{Signed into platform?}\n    B -->|Yes| C[Silent bind + upload]\n    B -->|No| D[Guest mode - retry every launch]\n    C --> E{state_version_id = current?}\n    E -->|Yes| F[Normal sync + Sync Toast]\n    E -->|No| G[Forced Update Popup]\n    G -->|Update Now| H[Store - update - relaunch]\n    H --> F\n    G -->|Returns without updating| G\n\n    F --> K{Return from BG - Login check}\n    K -->|Still owner| L[Signed-In Toast 1s]\n    K -->|Session taken| M[Another Device popup]\n    M -->|Re-login| N[Load server state]\n\n    F --> O{Connection drops?}\n    O -->|Yes| P[Offline Toast - progress may be lost]\n    P --> Q{Reconnect}\n    Q -->|Still owner| R[Push local state]\n    Q -->|Session taken| M\n\n    style F fill:#d4edda,stroke:#28a745\n    style L fill:#d4edda,stroke:#28a745\n    style R fill:#d4edda,stroke:#28a745\n    style N fill:#d4edda,stroke:#28a745\n    style P fill:#fff3cd,stroke:#ffc107\n    style G fill:#f8d7da,stroke:#dc3545\n    style M fill:#cce5ff,stroke:#0d6efd\n    style XX fill:#f0f0f0,stroke:#999\n\`\`\`\n\n	**Figma wireframes:** [https://www.figma.com/design/BI7JJI7lvTTO3zPfz935AH/](https://www.figma.com/design/BI7JJI7lvTTO3zPfz935AH/)\n	Each flow references specific Figma screens. Screens marked **NEW** need design from **Dean** before implementation.\n\n## Figma Screen Inventory\n\n\n**#**\n**Screen**\n**Status**\n**Notes**\n\n\n1\nSync Toast\n**Keep as-is**\n\"✓ Progress synced via Game Center\" (3s, one-time)\n\n\n2\nSigned-In Toast\n**Keep as-is**\n\"Signed in · Progress saved\" (1s, every BG return)\n\n\n3\nUpdate Popup\n**Redesign needed**\nWas dismissible toast with X. Now: popup with \"Update Now\" + \"No\". Not dismissible.\n\n\n4\nOffline Toast\n**Update copy**\nNew: **\"No internet connection. Your progress may be lost.\"**\n\n\n5\nNot-Syncing Toast\n**REMOVE**\nNo longer exists in the new model.\n\n\n6\nWelcome Back Toast\n**Keep as-is**\n\"Welcome back! Progress restored via Game Center\" (3s)\n\n\n9\n\"Another Device\" Popup\n**NEW — Dean**\nBlocking: \"Another device is logged in. Re-login to get your last known progress.\"\n\n\n---\n## Flow 1: First Launch\n**Trigger:** App opens for the first time.\n### Path A — Signed into platform\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nApp opens\n—\n—\n\n\n2\nSystem silently detects platform account\n— (invisible)\n—\n\n\n3\nPlatform account linked to distinct_id\n—\n\`platform_bindings\` created\n\n\n4\nLocal progress uploaded as initial server state\n—\n\`active_states\` created\n\n\n5\nFirst-sync confirmation\n**Sync Toast** (Figma #1): \"✓ Progress synced via Game Center\" (3s)\n—\n\n\n6\nNormal gameplay. Auto-save every N sec.\n—\nHeartbeat starts\n\n\n### Path B — NOT signed in\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nPlatform not detected\n—\n—\n\n\n2\nGuest mode. Local + DB saves.\n**Nothing.** Player doesn't know cloud save exists.\n—\n\n\n3\nRetries silently every future launch\n—\n—\n\n\n4\nOnce signed in → Path A runs\n—\n—\n\n\n### Path C — Mid-FTUE\nPlatform connection in background. Sync held until tutorial finishes. Once FTUE ends → sync + **Sync Toast**.\n### Example — first launch, signed in\n\`\`\`plain text\nthe user installs Merge Cruise on an iPhone. the user signed into Game Center.\n\n  What the user sees sees:\n  1. App opens normally — no login screen, no popup, no loading bar.\n  2. After a few seconds, a small green toast appears at the top:\n     \"✓ Progress synced via Game Center\"\n     It disappears after 3 seconds. \n     Each login abd back from background the user will see the system toast\n\`\`\`\n---\n## Flow 2: Return from Background\n**Trigger:** Player returns to the app from background. Login check determines if this device still owns the session.\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nApp returns to foreground\n—\n—\n\n\n2\nLogin check runs: is this device still the session owner?\n—\nCheck \`current_login_device_id\`\n\n\n3\nStill owner → load server state, resume play\n**Signed-In Toast** (Figma #2): \"Signed in · Progress saved\" (1s)\n—\n\n\n3 alt\nNot owner → another device logged in → see Flow 6\n**\"Another Device\" Popup** (Figma #9)\n—\n\n\n### Example — return from background, still owner\n\`\`\`plain text\nSarah puts Merge Cruise in the background to answer a text. She comes back 2 minutes later.\n\n  What Sarah sees:\n  1. Game resumes. A tiny toast flashes for 1 second: \"Signed in · Progress saved\".\n  2. She continues playing exactly where she left off. Nothing else happens.\n\`\`\`\n### Example — return from background, another device took over\n\`\`\`plain text\nSarah puts the game in background. Meanwhile, her son opens the game on the iPad.\nSarah comes back to the game 10 minutes later.\n\n  What Sarah sees:\n  1. A popup blocks the screen: \"Another device is logged in.\n     Re-login to get your last known progress.\"\n  2. She taps \"Re-login\".\n  3. The game loads the latest state (whatever her son played to on the iPad).\n  4. She continues from there.\n\`\`\`\n---\n## Flow 3: Reinstall / New Device\n**Trigger:** Fresh install, player signed into platform.\n### Path A — Cloud save exists, version OK\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nGame installed → privacy prompts\nOS prompts\n—\n\n\n2\nPlatform detected → cloud save found\n—\nLookup bindings → states\n\n\n3\nVersion check passes\n—\n—\n\n\n4\nLogin check → claim session\n—\n\`session_locks\` updated\n\n\n5\nFTUE skipped. Cloud save loaded.\n**Welcome Back Toast** (Figma #6): \"Welcome back!\" (3s)\n—\n\n\n### Path B — Version NOT in range\nVersion check fails → go to **Flow 4** (Update or Disconnect).\n### Path C — No cloud save\nNormal fresh start → existing FTUE flow.\n### Example — reinstall on a new phone\n\`\`\`plain text\nSarah gets a new iPhone. Signs into the same Game Center account.\n\n  What Sarah sees:\n  1. App opens — standard iOS privacy/notification prompts.\n  2. NO tutorial. The game skips straight to the lobby.\n     She’s back at chapter 25 with all her progress.\n  3. A toast appears: \"Welcome back! Progress restored via Game Center\" (3s).\n  4. That’s it. She continues playing as if nothing happened.\n\`\`\`\n---\n## Flow 4: Version Out of Range (Forced Update)\n**Trigger:** Installed version’s \`state_version_id\` ≠ server’s \`current_state_version_id\`. Shown on every app open / BG return until updated.\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nVersion check fails\n—\n\`technical_cloud_save_version_disconnected\` BI\n\n\n2\nUpdate Popup shown\n**Forced Update Popup** (Figma #3): \"Update Required\" with single \"Update Now\" button. No decline.\n—\n\n\n3\nPlayer taps **\"Update Now\"** → store opens\nApp Store / Play Store\n—\n\n\n3 alt\nUser closes store without updating → returns to game\n**Forced Update Popup shown again.** Persists until updated.\n—\n\n\n### Example — version mismatch forces update\n\`\`\`plain text\nSarah’s iPhone is on v0.38.210 (state_version_id = 1).\nThe team ships v0.38.300 with a breaking schema change and bumps current_state_version_id to 2.\nSarah opens the game.\n\n  What Sarah sees:\n  1. A popup appears (can’t be dismissed by tapping outside):\n     \"Update Available\"\n     \"Your saved game requires a newer version of the app.\n      Update to continue syncing your progress.\"\n     [Update Now]   [No]\n\n  2a. She taps \"Update Now\" → App Store opens. She updates to v0.38.300.\n      Next launch: normal gameplay, no popup.\n\n  2b. She taps \"No\" → A second popup appears:\n      \"Are you sure?\"\n      (Copy TBD — explains she’ll be disconnected, new account starts,\n       reconnecting requires contacting support)\n      [Yes, disconnect]   [Back]\n\n  3a. She taps \"Back\" → returns to the first popup. Can still update.\n\n  3b. She taps \"Yes, disconnect\" → one-time message:\n      \"You have been disconnected from Game Center.\n       To reconnect your progress, please contact support.\"\n      She now plays as a fresh guest. Her old cloud save is safe on the server\n      but she can’t access it without contacting support.\n\`\`\`\n---\n## Flow 5: Connection Lost Mid-Session\n**Trigger:** Internet drops during gameplay (heartbeat cannot reach server).\n### Path A — Reconnects, still session owner\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nHeartbeat fails\n—\nSession becomes stale\n\n\n2\nClient detects loss\n**Offline Toast** (Figma #4): **\"No internet connection. Your progress may be lost.\"** Visible while offline.\n—\n\n\n3\nGameplay continues locally. Nothing uploaded.\n—\n—\n\n\n4\nSilent retries (5s → 10s → 20s → 60s)\n—\n—\n\n\n5\nConnection restored\nToast disappears\n—\n\n\n6\nLogin check → still owner → push local state\n—\n\`active_states\` overwritten\n\n\n### Path B — Another device logged in while offline\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1–4\nSame as Path A (offline, local play)\n**Offline Toast**\n—\n\n\n5\nConnection restored\nToast disappears\n—\n\n\n6\nLogin check → session owner is now Device B\n**\"Another Device\" Popup** (Figma #9): \"Another device is logged in. Re-login to get your last known progress.\"\n—\n\n\n7\n\"Re-login\" → claim session → load server state (from B)\n—\nSession transfers\n\n\n8\n**Local offline progress is discarded** (not uploaded, not compared)\n—\n\`technical_cloud_save_forced_relogin\` BI\n\n\n### Example — offline, reconnects as owner\n\`\`\`plain text\nSarah is playing on the train. The tunnel kills her connection.\n\n  What Sarah sees:\n  1. A toast appears at the bottom: \"No internet connection. Your progress may be lost.\"\n     It stays visible.\n  2. She keeps playing — nothing is blocked. She completes 3 board tasks.\n  3. The train exits the tunnel. Connection restored.\n  4. The toast disappears. Her progress is saved to the server.\n  5. She continues as normal. No popups, no interruptions.\n\`\`\`\n### Example — offline, another device logged in meanwhile\n\`\`\`plain text\nSarah loses connection on the train. Meanwhile, her son opens the game on the iPad.\n\n  What Sarah sees:\n  1. Toast: \"No internet connection. Your progress may be lost.\"\n  2. She keeps playing locally for 20 minutes.\n  3. Connection comes back. Toast disappears.\n  4. BUT: a popup blocks the screen:\n     \"Another device is logged in. Re-login to get your last known progress.\"\n  5. She taps \"Re-login\".\n  6. The game loads the iPad’s state (what her son played to).\n     Sarah’s 20 minutes of offline progress is gone.\n     (The offline toast warned her: \"your progress may be lost.\")\n\`\`\`\n---\n## Flow 6: Multi-Device — Login Check (Newer Login Wins)\n**Trigger:** A second device opens the app while another was session owner.\n### Scenario A — Sequential switching\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nDevice A plays and saves (owner)\n—\nHeartbeat active A\n\n\n2\nPlayer closes A, opens B\n—\n—\n\n\n3\nB login check → claims session\n—\n\`current_login_device_id = B\`\n\n\n4\nB loads server state, plays and saves\n—\n\`active_states\` overwritten by B\n\n\n5\nPlayer returns to A. Login check: owner is B.\n**\"Another Device\" Popup** (Figma #9)\n—\n\n\n6\n\"Re-login\" → A claims session → loads latest state\n—\nSession transfers to A\n\n\n### Scenario B — Both open simultaneously\nWhichever logs in later becomes owner. The other sees the **\"Another Device\" Popup** on next heartbeat / BG return. No ping-pong.\n### Example — switching between two devices\n\`\`\`plain text\nSarah plays on her iPhone (Device A) to chapter 25 and closes the app.\nShe picks up her iPad (Device B) and opens the game.\n\n  What Sarah sees on the iPad:\n  1. Game opens. Loads chapter 25 (from the server). Normal gameplay.\n  2. She plays to chapter 27 on the iPad.\n\n  Later, she opens the iPhone again.\n\n  What Sarah sees on the iPhone:\n  1. A popup: \"Another device is logged in.\n     Re-login to get your last known progress.\"\n  2. She taps \"Re-login\".\n  3. Game loads chapter 27 (what she played to on the iPad).\n  4. She continues from chapter 27. Seamless.\n\n  In the 2-devices indicator (account UI), Sarah sees:\n  - iPhone — current session owner ✅\n  - iPad — connected\n\`\`\`\n---\n## Flow 7: Platform Sign-Out / Sign-In (OS-Level)\n### Sign-Out\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nPlatform signed out (OS callback)\n—\n—\n\n\n2\nNew \`distinct_id\` generated\n—\n\`device_id_history\` updated\n\n\n3\nCloud sync stops. Continues as guest.\n**Nothing.** Silent.\nCloud state preserved on server\n\n\n### Sign Back In (same account)\n\n\n**Step**\n**What happens**\n**UI shown**\n**Server**\n\n\n1\nPlayer signs back in\n—\n—\n\n\n2\nLogin check → claim session → load server state\n**Nothing.** Silent.\nSession ownership transfers\n\n\n3\nLocal guest progress NOT merged. Contact support if needed.\n—\n—\n\n\n### Example — platform sign-out and sign back in\n\`\`\`plain text\nSarah goes to iPhone Settings and signs out of Game Center (for some reason).\n\n  What Sarah sees:\n  1. Nothing in the game changes. She’s still at chapter 25.\n  2. She keeps playing. But behind the scenes, cloud sync has stopped.\n     A new guest account was created silently.\n  3. She plays to chapter 28 as a guest.\n\n  A week later, she signs back into Game Center in Settings.\n\n  What Sarah sees:\n  1. Game opens normally. No popup, no toast.\n  2. BUT: the game loads chapter 25 (the last cloud-saved state),\n     not chapter 28 (her guest progress).\n  3. Her 3 chapters of guest progress are NOT merged.\n     If she needs them back, she contacts support.\n\`\`\`\n---\n# 8. Session Ownership (Heartbeat + Login Check)\n### How It Works\n1. Device registers heartbeat: \`POST /session/heartbeat\` every **X** **seconds** (configurable via \`heartbeat_interval_seconds\`).\n2. Server stores: \`distinct_id\`, \`device_id\`, \`last_heartbeat_timestamp\`, \`current_login_device_id\`.\n3. Session is **active** if \`last_heartbeat < 90 seconds ago\` (configurable via \`session_stale_threshold_seconds\`).\n4. **Login check** runs on every app open and return from background: if \`current_login_device_id\` != this device, show **\"Another device is logged in\"** popup and block saves until re-login.\n### When Device B logs in while Device A is active\n1. Device B logs in → server sets \`current_login_device_id = B\`.\n2. Device A's next heartbeat / save returns \`SESSION_INVALIDATED\` → stops saving.\n3. Device A, on next open or return from background, runs login check → **\"Another device is logged in. Re-login to get your last known progress.\"**\n### Key Rules\n- Heartbeat does not \"fight\" the other device. Ownership changes **only on login**, not on heartbeat.\n- Max state loss on takeover = whatever Device A had not yet saved at the moment B logged in; that local work is discarded (last-write-wins; no merge).\n- The \"No internet connection. Your progress may be lost.\" toast is what warns players about this upfront.\n- Session ownership is server-side only — clients don't coordinate.\n---\n# 9. Safety & Recovery\n## 9.1 State Handling (no archival)\n- The server stores exactly **one active state per user**. Every save overwrites it.\n- **No ****\`state_history\`**** archival** (removed). There are no \"losing\" saves because there is no comparison.\n- Support recovery relies on: (a) BI event logs + admin restore tool for re-binding a disconnected device to the original platform account, (b) platform-level backups outside the scope of this PRD, (c) optional low-frequency snapshot policy (R&D to decide whether a **daily snapshot** is worth keeping purely as a safety net for corruption; default: off in MVP).\n## 9.2 Corruption Detection\n- Every state validated before loading (SHA-256 checksum).\n- Fallback chain: cloud → local → optional daily snapshot (if adopted) → auto support ticket. No \`state_history\` table.\n## 9.3 Admin Restore Tooling\nSupport team must have:\n1. **Search** by \`distinct_id\`, \`platform_id\`, or \`device_id\`.\n2. **View write log** — BI-backed log of saves / login checks / takeovers (not a rollbackable state history).\n3. **Re-bind a disconnected device** — link a device's new \`distinct_id\` back to the original platform account (needed after a version-decline disconnect).\n4. **Restore from optional daily snapshot** (if adopted) in corruption incidents.\n5. **Bulk re-bind** via CSV for incidents affecting multiple users.\n6. **Auto-alerting:** If \`technical_state_save_failure\` rate exceeds 5% of active users.\n---\n# 10. UI Elements — Complete Summary\n\n	**See Section 7 (Figma Screen Inventory table) for the full list of screens, their status (keep / redesign / new), and Figma references.** The descriptions below provide copy and behavior details.\n\n## Sync Toast (shown once) — Figma #1\n- **When:** First successful cloud sync ever\n- **Copy (iOS):** \"✓ Progress synced via Game Center\" \\| **(Android):** \"✓ Progress synced via Google Play Games\" \\| **(reinstall):** \"Welcome back! Progress restored via ...\"\n- **Behavior:** Auto-dismisses after 3 seconds. Waits for natural pause if mid-gameplay.\n## Signed-In Confirmation Toast (every return from background) — Figma #2\n- **Duration:** 1 second. Confirms user is signed in and progress is being saved.\n## Forced Update Popup\n- **When:** Installed version’s \`state_version_id\` ≠ server’s \`current_state_version_id\`. Shown on **every app open and return from background** until the user updates.\n- **What:** Centered popup, dimmed overlay. **Not dismissible** — no X, no tap-outside, no secondary button.\n- **Header:** \"Update Required\"\n- **Body:** \"A new version is required to continue playing. Update now to keep your progress synced.\"\n- **Single button:** **\"Update Now\"** → opens App Store / Play Store.\n- **Behavior:** If user returns from store without updating, popup re-appears. Blocks all gameplay.\n## Offline Toast (mid-session only)\n- **When:** Connection drops mid-session (heartbeat cannot reach server). **NOT** on app launch (existing error popup handles that).\n- **Copy:** **\"No internet connection. Your progress may be lost.\"**\n- **Behavior:** Visible while offline. Reappears on every background return while offline. Disappears on reconnect. Not shown during FTUE or for guest users. Retries happen silently; on reconnect the device reconnects and saves the current local state as the next write (if it still owns the session).\n## \"Another Device Is Logged In\" Popup\n- **When:** Login check on app open / return from background finds that another device has claimed the session since this device last wrote.\n- **What:** Blocking modal with dimmed overlay.\n- **Copy:** **\"Another device is logged in. Re-login to get your last known progress.\"** (copy TBD with Dean.)\n- **Buttons:** **\"Re-login\"** (claims session, loads latest server state) • optional secondary **\"Exit\"**.\n- **Behavior:** Cannot be dismissed by tapping outside. Player must act.\n## Nothing Else\nNo lobby badge, no connect/disconnect button, no settings toggle, no login screen, no error popups beyond the above.\n---\n# 11. Configuration\n\n\n\n**Parameter**\n**Default**\n**Notes**\n\n\n**\`cloud_save_enabled\`**\ntrue\nYes (server-side)\n\n\n\`save_interval_seconds\`\n5\nSeconds between auto-saves during gameplay\n\n\n\`heartbeat_interval_seconds\`\n10\nSeconds between session heartbeats\n\n\n\`session_stale_threshold_seconds\`\n90\nMissed heartbeat threshold = stale session\n\n\n\`save_retry_intervals\`\n5s → 10s → 20s → 60s (capped)\nExponential backoff for save/connection failures\n\n\n\`save_retry_max_attempts\`\n5\nAfter this many failures → increase local save frequency as backup\n\n\n\`state_version_buckets\`\nSee Section 6.1\nMaps app versions to \`state_version_id\` buckets. Same-bucket versions sync freely. See Section 6.1.\n\n\n\`current_state_version_id\`\n1\nThe active bucket. Devices on a different bucket must update or disconnect. See Section 6.1.\n\n\n\`cloud_save_excluded_versions\`\n\\[\\] (empty)\nSpecific versions to exclude (known-broken builds). Triggers server alert. See Section 6.1.\n\n\n\`daily_snapshot_enabled\` (optional)\nfalse\nIf R&D adopts daily snapshots as a corruption safety net, they are stored separately from \`active_states\` and used only by G3 fallback and admin restore. No per-save history.\n\n\n### In-App Soft Update (separate system — Firebase Remote Config)\n\n\n\n**Key**\n**Default**\n**Notes**\n\n\n\`update_prompt_enabled\`\nfalse\nGlobal kill switch for soft update prompt\n\n\n\`update_prompt_min_version\`\n—\nusers below this see the soft prompt\n\n\n\`update_prompt_target_version\`\n—\nVersion shown in dialog copy (iOS)\n\n\n\`update_prompt_cooldown_hours\`\n24\nHours between re-prompts after user taps \"Later\"\n\n\n---\n# 12. Analytics & BI Events\n## Super Properties\n\n\n\n**Property**\n**Type**\n**Values**\n**When Set**\n\n\n\`cloud_save_platform\`\nString\n\`game_center\`, \`google_play\`, \`none\`\nEvery app launch after platform detection\n\n\n\`previous_distinct_id\`\nString/null\nPrevious distinct_id on this device\nWhen distinct_id changes\n\n\n\`connected_devices\`\nint\nnumber of connected devices\nincreased or decreased based on the connected devices\nfirst connection / disconnection to the game center / google play\n\n\n## Existing Event Additions\n### \`impression_scapes\` (lobby load)\n\n\n\n**Param**\n**Type**\n**Values**\n**Logic**\n\n\n\`cloud_save_connected\`\nBoolean\n1 / 0\n**Derived from ****\`cloud_save_platform\`**** super property.** 1 if \`cloud_save_platform\` ≠ \`none\`; 0 if \`none\`. Kept on \`impression_scapes\` for backward compatibility; not needed as a separate super property since \`cloud_save_platform\` covers all cases.\n\n\n\`cloud_save_platform\`\nString\n\`game_center\`, \`google_play\`, \`null\`\nPlatform used\n\n\n## New Events\n### 12.1 Connection Flow\n\n\n**Event**\n**Trigger**\n\n\n\`technical_cloud_save_connection_attempt\`\nSystem attempts Game Center / Google Play connect on launch\n\n\n\`technical_cloud_save_connection_success\`\nPlatform account detected and linked\n\n\n\`technical_cloud_save_connection_failure\`\nConnection fails\n\n\n\`technical_cloud_save_binding_check_failed\`\nServer binding check fails after successful local login\n\n\n\`impression_cloud_save_sync_toast\`\nOne-time sync toast shown\n\n\n\`impression_cloud_save_signed_in_toast\`\nSigned-in toast shown on return from background (Figma #2, 1s auto-dismiss)\n\n\n### 12.2 State Sync Flow\n\n\n**Event**\n**Trigger**\n**Params**\n\n\n\`technical_state_load\`\nState loaded from cloud during login\n\`state_version\`, \`state_version_id\`\n\n\n\`technical_state_load_failure\`\nState load fails\n\`error_code\`, \`error_message\`\n\n\n\`technical_state_login_check\`\nLogin check run on app open / background return\n\`current_login_device_id_matches\` (1/0), \`action\` (load_state / show_relogin_popup / take_ownership), \`platform\`, \`state_version_id\`, \`current_state_version_id\`\n\n\n\`impression_cloud_save_relogin_popup\`\n\"Another device is logged in\" popup shown (Figma #9)\n\`previous_owner_device_id\`, \`current_owner_device_id\`, \`trigger\` (app_open / background_return / offline_reconnect)\n\n\n\`click_cloud_save_relogin_popup_exit\`\nPlayer taps \"Exit\" on the \"Another device\" popup (optional secondary button)\n\`click_id\`\n\n\n\`click_cloud_save_relogin_popup_relogin\`\nPlayer taps \"Re-login\" on the \"Another device\" popup\n\`click_id\`\n\n\n\`technical_state_corruption_detected\`\nCorrupted state found\n\`corrupted_state\` (local / cloud / both), \`resolution\` (cloud_loaded / local_kept / backup_loaded / support_ticket_created)\n\n\n\`technical_purchase_restore\`\nIAP purchases restored during sync\n\`restored_items_count\`\n\n\n\`technical_cloud_save_schema_migration\`\nState blob required schema migration\n\`from_version\`, \`to_version\`, \`success\`, \`fallback_action\` (if failed)\n\n\n### 12.3 State Save Flow\n\n\n\n**Event**\n**Trigger**\n**Params**\n\n\n\`technical_state_save_failure\`\nCloud save fails during gameplay\n\`error_code\`, \`error_message\`, \`consecutive_failures\`\n\n\n\`technical_state_save_conflict\`\nSave rejected (409 — another device saved between reads)\n\`expected_timestamp\`, \`actual_timestamp\`, \`resolution\` (retry / show_relogin_popup)\n\n\n### 12.4 Offline Flow\n\n\n**Event**\n**Trigger**\n**Params**\n\n\n\`impression_cloud_save_offline_toast\`\nOffline toast shown (mid-session or background return while offline)\n\`trigger\` (connection_lost / return_from_background)\n\n\n\`click_cloud_save_offline_toast_dismiss\`\nUser taps X on offline toast (if dismissible — see Section 10 for behavior)\n\`click_id\`\n\n\n\`technical_cloud_save_back_online\`\nReconnects + first successful save\n\`local_saves_during_offline\`\n\n\n### 12.5 Update Prompt Flow (Version Mismatch)\n\n\n**Event**\n**Trigger**\n**Params**\n\n\n\`impression_cloud_save_update_popup\`\nUpdate prompt popup appears — version out of range (Figma #3)\n\`required_version_min\`, \`required_version_max\`, \`trigger\` (app_launch / return_from_background), \`state_version_id\`, \`current_state_version_id\`\n\n\n\`click_cloud_save_update_popup_update\`\nuser taps \"Update Now\"\n\`required_version_min\`, \`required_version_max\`, \`click_id\`\n\n\n\n\n\n**Event**\n\n\n\`required_version_min\`, \`required_version_max\`, \`click_id\`\n\n\n### 12.6 Version Pool Events\n\n\n\n**Event**\n**Trigger**\n\n\n\`technical_cloud_save_version_disconnected\`\nVersion falls outside supported range. Fires when update prompt is triggered.\n\n\n\`click_cloud_save_update_confirm_back\`\nPlayer tapped \"Back\" in the confirmation → returns to update prompt\n\n\n### 12.7 Multi-Device / Heartbeat\n\n\n\n**Event**\n**Trigger**\n**Params**\n\n\n\`technical_cloud_save_heartbeat_conflict\`\nHeartbeat detects another device\n\n\n\n\`technical_cloud_save_forced_relogin\`\nDevice completed re-login after seeing \"Another device is logged in\" popup.\n\`trigger\` (app_open / background_return / offline_reconnect / session_taken_over_by_other_device), \`previous_owner_device_id\`, \`new_owner_device_id\`\n\n\n### 12.8 Platform Disconnect / Reconnect\n\n\n\n**Event**\n**Trigger**\n**Params**\n\n\n\`technical_cloud_save_platform_disconnect\`\nPlatform account signed out\n\`detection_method\` (app_launch / mid_session), \`previous_distinct_id\`, \`new_distinct_id\`\n\n\n\`technical_cloud_save_platform_reconnect\`\nSame platform account signed back in\n\`platform_account_id\`, \`previous_distinct_id\`, \`new_distinct_id\`\n\n\n\n	**POST MVP:** \`technical_cloud_save_platform_switch\` removed — account switching not in MVP.\n\n### 12.9 Reinstall / New Device\n\n\n\n**Event**\n**Trigger**\n**Params**\n\n\n\`technical_cloud_save_restore\`\nCloud save restored on new device/reinstall (tutorial skipped)\n\`platform_account_id\`, \`restored_chapter\`, \`restored_credits\`\n\n\n## Support & State Recovery Params\nAll cloud save technical events include:\n\n\n**Param**\n**Present On**\n**Purpose**\n\n\n\`distinct_id\`\nAll events\nCurrent user ID\n\n\n\`device_id\`\nAll events\nPhysical device — multi-device tracing\n\n\n\`platform_account_id\`\nConnection/sync/disconnect events\nLinks all devices under one user\n\n\n\`previous_distinct_id\`\nDisconnect/reconnect events\nIdentity transition tracing\n\n\n---\n# 13. Master Scenario Table — All Cases × User Experience\n\n	**Every scenario mapped to: trigger, what the user sees, which UI element (Figma screen), and server behavior.** This is the single source of truth for QA and implementation.\n\n\n\n**#**\n**Scenario**\n**Trigger**\n**User sees**\n**UI element**\n**Figma**\n**Server**\n\n\n1\nFirst launch, signed in\nApp open, platform detected\nGreen toast, 3s\nSync Toast\n#1\nBind + initial upload\n\n\n2\nFirst launch, not signed in\nNo platform\nNothing\n—\n—\nGuest mode, retry every launch\n\n\n3\nFirst launch, mid-FTUE\nDuring tutorial\nToast after FTUE\nSync Toast\n#1\nSync deferred\n\n\n4\nReturn from BG, still owner\nBG return, same session\nBrief toast, 1s\nSigned-In Toast\n#2\nLogin check let messages=[];
let isTyping=false;

function askExample(btn){document.getElementById('input').value=btn.textContent;send();}

function fmt(text){
  text=text.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  text=text.replace(/`([^`]+)`/g,'<code>$1</code>');
  text=text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  text=text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  text=text.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  text=text.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  text=text.replace(/^- (.+)$/gm,'<li>$1</li>');
  text=text.replace(/(<li>[\s\S]*?<\/li>)/g,function(m){return '<ul>'+m+'</ul>';});
  text=text.replace(/<\/ul>\s*<ul>/g,'');
  text=text.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  text=text.replace(/\n\n/g,'</p><p>');
  text='<p>'+text+'</p>';
  text=text.replace(/<p><\/p>/g,'');
  text=text.replace(/<p>(<h3>|<ul>|<ol>|<pre>)/g,'$1');
  text=text.replace(/(<\/h3>|<\/ul>|<\/ol>|<\/pre>)<\/p>/g,'$1');
  return text;
}

function addMsg(role,text){
  const chat=document.getElementById('chat');
  const g=document.createElement('div');
  g.className='msg-group '+(role==='user'?'user':'ai');
  const a=document.createElement('div');
  a.className='msg-avatar';
  if(role==='user'){a.textContent='\u{1F464}';}
  else{a.textContent='\u2728';a.style.cssText='background:linear-gradient(135deg,#1a1a2e,#3d3d7e);color:white;box-shadow:0 1px 2px rgba(0,0,0,0.04)';}
  const c=document.createElement('div');
  c.className='msg-content';
  c.innerHTML=role==='user'?text.replace(/</g,'&lt;').replace(/>/g,'&gt;'):fmt(text);
  g.appendChild(a);g.appendChild(c);chat.appendChild(g);
  // Scroll so the START of the new message is visible at the top
  requestAnimationFrame(()=>{
    if(role==='ai'){
      g.scrollIntoView({behavior:'smooth',block:'start'});
    } else {
      chat.scrollTop=chat.scrollHeight;
    }
  });
  return g;
}

function showTyping(){
  const chat=document.getElementById('chat');
  const ind=document.createElement('div');
  ind.className='typing-indicator';ind.id='typing';
  const a=document.createElement('div');
  a.className='msg-avatar';
  a.style.cssText='background:linear-gradient(135deg,#1a1a2e,#3d3d7e);color:white;box-shadow:0 1px 2px rgba(0,0,0,0.04)';
  a.textContent='\u2728';
  const d=document.createElement('div');
  d.className='typing-dots';
  d.innerHTML='<span></span><span></span><span></span>';
  ind.appendChild(a);ind.appendChild(d);chat.appendChild(ind);
  chat.scrollTop=chat.scrollHeight;
}
function hideTyping(){const el=document.getElementById('typing');if(el)el.remove();}

async function send(){
  if(isTyping)return;
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text)return;
  input.value='';input.style.height='40px';
  const w=document.getElementById('welcome');if(w)w.style.display='none';
  const ex=document.getElementById('examples-section');if(ex)ex.style.display='none';
  addMsg('user',text);
  messages.push({role:'user',content:text});
  const btn=document.getElementById('send-btn');
  btn.disabled=true;isTyping=true;showTyping();
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':_d(_e,_k),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2048,system:SYSTEM,messages:messages.slice(-10)})
    });
    hideTyping();
    if(!resp.ok){const err=await resp.json();addMsg('ai','Sorry, I encountered an error: '+(err.error?.message||'Request failed.'));messages.pop();}
    else{const data=await resp.json();const answer=data.content[0].text;addMsg('ai',answer);messages.push({role:'assistant',content:answer});}
  }catch(e){hideTyping();addMsg('ai','Connection error. Please check your internet and try again.');messages.pop();}
  btn.disabled=false;isTyping=false;input.focus();
}
</script>
