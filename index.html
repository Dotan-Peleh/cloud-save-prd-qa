function _d(e,k){const b=atob(e);let r='';for(let i=0;i<b.length;i++)r+=String.fromCharCode(b.charCodeAt(i)^k.charCodeAt(i%k.length));return r;}

const PRD_URL="https://www.notion.so/peerplay/Game-Center-Google-Play-332c2344a7dc81f4999bf63a6e39c5fa";
const PRD="\\nRelated: \\\\| \\n---\\n## Brief\\n\\n---\\n# 1. Overview & Goals\\n**Platforms:** iOS (Game Center), Android (Google Play Games Services)\\nThe game automatically and silently connects users to their platform account and uses it to back up and restore progress. The flow is **mostly frictionless**, with two intentional interruptions: (a) version mismatch with multi-device forces a **mandatory update**, and (b) if another device takes over while this device was actively playing, a re-login popup is shown. Sequential device switching (close one, open another) is seamless \u2014 no popup.\\n<callout icon=\\\"\ud83d\udc65\\\" color=\\\"blue_bg\\\">\\n\\t**Design review pending.** New popup copy / UI (forced update popup, \u201cAnother device is logged in\u201d popup) needs to be reviewed with **Dean** before implementation.\\n</callout>\\n### Goals\\n- Prevent loss of user progress across devices and reinstalls\\n- Improve user trust and retention\\n- Eliminate login and restore friction\\n- Provide a stable foundation for future platform features (achievements, leaderboards)\\n---\\n# 2. Scope\\n### In Scope (MVP)\\n- Automatic silent login on app launch\\n- Platform account binding (platform_id \u2194 distinct_id)\\n- Cloud save and restore using a **single-state, last-write-wins** model \u2014 no state comparison\\n- **Login check on app open / return from background.** Newer login wins; older device (in case active) is prompted to re-login to get the last known progress\\n- One-time sync confirmation toast + signed-in toast on background return (return from background equals game login)\\n- **Version range enforcement.** If installed version is not in the supported range: **forced update popup** \u2014 the user MUST update. No \\\"No\\\" button, no decline option, no disconnect path. The popup blocks gameplay until the user updates.\\n- **Feature flag** (`multi_device_sync_enabled`): server-side on/off kill switch for **multi-device sync via Game Center / Google Play**. When off: no platform binding, no cross-device sync, no login check, no \\\"Another Device\\\" popup. Game state is still saved (server + local) \u2014 users just can\u2019t share progress across devices. No toasts).\\n- Session ownership via heartbeat (one device at a time). No heartbeat while playing \u2192 offline toast: **\\\"No internet connection. Your progress may be lost.\\\"** Retries; on reconnect the device reconnects and saves.\\n- Corrupted save detection and fallback (R&D to define recovery logic)\\n- Reinstall recovery (skip FTUE, restore server state)\\n- Platform disconnect handling (OS-level sign-out) \u2192 new distinct_id; signing back in loads server state (no merge of guest progress)\\n- Full analytics and logging\\n- Admin restore tooling\\n### Out of Scope (post MVP)\\n- Platform account switching (signing into a **different** Game Center / Google Play account) \u2014 **POST MVP**\\n- Manual login/logout\\n- Cross-platform account merging (iOS \u2194 Android)\\n- Facebook / Apple Connect integration\\n- Achievements, leaderboards, social features\\n- Onboarding or forced login messaging\\n---\\n# 3. Core Design Principles\\n<callout icon=\\\"\ud83d\udcbe\\\">\\n\\t**Single server state.** The server holds exactly one state per user \u2014 the last state saved by the currently logged-in device. No state comparison, no chapter/credits/timestamp tiebreakers, no \\\"losing state\\\" archival. The login check (Section 5) decides who owns the state next.\\n</callout>\\n<callout icon=\\\"\ud83d\udd10\\\">\\n\\t**Login check \u2014 newer login wins.** When a second device logs in, the server swaps ownership to the new device. If the previous device **had an active session** (was playing, heartbeat alive), it sees **\\\"****Another device is logged in \u2014 re-login to get your last known progress.\\\"** The UI shows **2 connected devices**** indication**. and the game will be logged out. \\n</callout>\\n<callout icon=\\\"\u26a1\\\">\\n\\t**One device at a time.** Only the device holding the active session (heartbeat) saves. A new login on another device transfers ownership. If the old device was actively playing, it must re-login on return. If it was already closed (session expired), it simply loads the latest server state on next open \u2014 no popup.\\n</callout>\\n<callout icon=\\\"\ud83d\udc41\ufe0f\\\">\\n\\t**Invisible by design \u2014 with two intentional interruptions.** No login screens, no buttons, no settings in the normal path. The only UI:\\n\\t- **Sync toast** (one-time) \u2014 confirms progress is synced\\n\\t- **Signed-in toast** (1 sec) \u2014 brief confirmation on return from background\\n\\t- **Forced update popup** \u2014 installed version is out of the supported range. **No decline option.** Only button: \\\"Update Now\\\" \u2192 opens store. Popup blocks gameplay until updated.\\n\\t- **Offline toast** (\\\"No internet connection. Your progress may be lost.\\\") \u2014 mid-session connectivity loss; retries silently; reconnects and saves on recovery\\n\\t- **\\\"Another device is logged in\\\" popup** \u2014 shown only when this device\u2019s active session was taken over by another device. Not shown for normal sequential switching (close A, open B, open A = seamless).\\n</callout>\\n---\\n# 4. Architecture Overview\\n<callout icon=\\\"\ud83c\udfd7\ufe0f\\\" color=\\\"gray_bg\\\">\\n\\tThe sync system is built on one principle: **the server holds the single source of truth \u2014 one state per user, updated via delta on every save by the currently logged-in device.** Devices never compare states. On app open / return from background the device runs a **login check**; if the device no longer owns the session (because a newer login has claimed it), the device must re-login before it can play or save.\\n</callout>\\n## 4.1 State Model\\nEvery game state saved to the server includes:\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Field**</td>\\n<td>**Type**</td>\\n<td>**Description**</td>\\n</tr>\\n<tr>\\n<td>`distinct_id`</td>\\n<td>String</td>\\n<td>Internal user ID</td>\\n</tr>\\n<tr>\\n<td>`state_blob`</td>\\n<td>Binary (MessagePack)</td>\\n<td>**State delta** (MessagePack format). The server stores state deltas, not a full blob overwrite. Forward-compatible: new fields always have default values, old clients ignore unknown fields.</td>\\n</tr>\\n<tr>\\n<td>`checksum`</td>\\n<td>String</td>\\n<td>SHA-256 of state_blob \u2014 corruption detection</td>\\n</tr>\\n<tr>\\n<td>`timestamp`</td>\\n<td>Datetime</td>\\n<td>**Server-assigned timestamp** on every save. Used for **409 conflict detection** on concurrent writes and to determine session recency during login check.</td>\\n</tr>\\n<tr>\\n<td>`max_supported_chapter`</td>\\n<td>Integer</td>\\n<td>Highest chapter this version supports. Prevents downgrade updates.</td>\\n</tr>\\n<tr>\\n<td>**`state_version_id`**</td>\\n<td>Integer</td>\\n<td>**The state version bucket this app version belongs to** (see Section 6.1). Looked up from `state_version_buckets` config at login. If this doesn\u2019t match the server\u2019s `current_state_version_id`, the device must update.</td>\\n</tr>\\n<tr>\\n<td>state_schema_version</td>\\n<td>Integer</td>\\n<td>Schema version of this state blob. Used for migration checks (Section 6.5). Incremented only on breaking schema changes. Old clients ignore unknown fields; new clients use defaults for missing fields.</td>\\n</tr>\\n</table>\\n## 4.2 Server Tables\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Table**</td>\\n<td>**Purpose**</td>\\n<td>**Key**</td>\\n</tr>\\n<tr>\\n<td>`active_states`</td>\\n<td>**One row per user \u2014 the canonical current state.** Updated on every save via delta. `state_history` exists for backoffice restore (see Section 9).</td>\\n<td>`distinct_id`</td>\\n</tr>\\n<tr>\\n<td>`platform_bindings`</td>\\n<td>Maps platform_id \u2192 distinct_id. Tracks the set of devices currently connected to the platform account.</td>\\n<td>`platform_id`</td>\\n</tr>\\n<tr>\\n<td>`session_locks`</td>\\n<td>Active session heartbeat + `current_login_device_id`. A new login on another device updates this row \u2014 older device must re-login on return.</td>\\n<td>`distinct_id`</td>\\n</tr>\\n<tr>\\n<td>`device_id_history`</td>\\n<td>All distinct_ids used on each device. For restoring previous ID on platform disconnect.</td>\\n<td>`device_id`  \u2022 `distinct_id`</td>\\n</tr>\\n<tr>\\n<td>`device_activity`</td>\\n<td>Tracks `last_server_activity` per device \u2014 updated on ANY server interaction (events, API calls, analytics, heartbeat). **Server-side timestamps only.** Useful for monitoring and support investigations.</td>\\n<td>`device_id`</td>\\n</tr>\\n</table>\\n## 4.3 Key Architectural Rules\\n1. **Server is the source of truth \u2014 one state per user.** The server stores exactly one state per user. Devices always load server state on login, never compare local vs. cloud.\\n2. **Last write wins.** The currently logged-in (session-owning) device writes state deltas to the server. No comparison, no tiebreakers, no chapter / credits / timestamp / sequence-number resolution.\\n3. **`timestamp`**** is for concurrent-write conflict detection and login recency only** \u2014 not for state comparison. Server-assigned on every save.\\n4. **Login check on every app open / background return.** Three outcomes:\\n\\t- **Still the session owner** \u2192 load server state, continue.\\n\\t- **Session was taken over while this device was active** (heartbeat was alive when another device claimed ownership) \u2192 show \\\"Another device is logged in\\\" popup, must re-login.\\n\\t- **Device was inactive** (closed / session expired) and another device played \u2192 silently load latest server state, claim new session. **No popup.** This is normal sequential switching.\\n5. **One active session at a time.** Heartbeat identifies the owning device. A new login transfers ownership; the old device stops saving.\\n6. **Checksums on everything.** Every state blob is SHA-256 validated before loading.\\n7. **Forward-compatible state blobs.** The state_blob schema MUST be forward-compatible: new fields always have default values, old clients ignore unknown fields. This eliminates the need for version pool changes in most cases. Breaking schema changes (field type changes, field removals, core restructuring) should be rare (1-2x/year) and require bumping `cloud_save_min_version`. Compatible changes (new fields with defaults, new optional features, new enum values) require NO config change.\\n**Compatible change examples (NO min-version bump):**\\n- Adding `daily_challenges` field \u2192 default `null` (old client ignores it, new client initializes fresh)\\n- Adding `metapoints_balance` field \u2192 default `0` (old client ignores it, new client starts at 0)\\n- Adding new item_ids to inventory catalog \u2192 old client can't render them but this triggers the update prompt (Section 6.2), not a schema break\\n**Breaking change examples (REQUIRES min-version bump):**\\n- Changing `board_state` from flat array to nested object \u2192 old client crashes on parse\\n- Removing `credits_balance` field (renamed to `currency`) \u2192 old client can't find expected field\\n- New Items \\n- New feature \\n- Restructuring chapter data model \u2192 old client can't deserialize\\n- etc\\n<callout icon=\\\"\u261d\ud83c\udffb\\\">\\n\\t**Immediate save triggers**<br>Chapter, balance, board task, purchase, milestone / progress increased , Rewards, background\\n</callout>\\n---\\n# 5. Ownership Rule\\n<callout icon=\\\"\u2705\\\" color=\\\"green_bg\\\">\\n\\t**One state on the server, last writer wins, newer login owns the state.** `timestamp` (server-assigned) is used for conflict detection and login recency only.\\n</callout>\\n### 5.1 The rule\\n1. The server stores **one active state** per user.\\n2. Only the device that owns the **active session** (holds the heartbeat + current login) may save. Saves update the server state via delta.\\n3. When a device opens the app or returns from background, it runs a **login check**:\\n\\t- **Still the session owner** \u2192 load server state, continue playing, save as normal.\\n\\t- **Session was taken over while this device was active** (heartbeat was alive when another device claimed ownership) \u2192 show **\\\"Another device is logged in \u2014 re-login to get your last known progress\\\"** popup. Player must re-login.\\n\\t- **Device was inactive** (closed / session expired) when another device played \u2192 silently load latest server state, claim new session. No popup. This is the normal sequential switching path. Once claimed, server state is loaded and gameplay resumes.\\n4. When a device logs in, it **takes over** ownership: the server marks this device as the current session holder. The previous owner sees the popup **only if it had an active session** at the time of takeover. If the previous owner was already closed (session expired), it loads the latest server state on next open \u2014 no popup.\\n5. No local-vs-cloud comparison, ever. The server state is authoritative; whichever device wrote it last is what the next logged-in device plays.\\n### 5.2 Example \u2014 offline + second-device takeover\\n```plain text\\nT0: Device A is playing, session owner, at some state S_A. Writes S_A to server.\\nT1: Device A loses connectivity. Client stops receiving heartbeat.\\n    \u2192 Toast: \\\"No internet connection. Your progress may be lost.\\\"\\n    \u2192 Client retries silently. Local play continues but is NOT synced.\\nT2: Device B opens. Runs login check. Server session is still Device A's but Device A\\n    has not heartbeat for > 3 seconds (session_stale_threshold) \u2192 Device B claims the session.\\n    Device B loads S_A from server and continues playing, writing S_B1, S_B2, \u2026\\nT3: Device A's network returns. Client attempts to reconnect.\\n    Login check: session owner is now Device B.\\n    \u2192 Popup: \\\"Another device is logged in. Re-login to get your last known progress.\\\"\\n    Player re-logs in \u2192 Device A claims session \u2192 loads latest server state (S_Bn) \u2192 plays.\\n    Local progress Device A made while offline is DISCARDED (not uploaded, not compared).\\n```\\n---\\n# 6. Version Management\\n<callout icon=\\\"\ud83d\udd11\\\" color=\\\"red_bg\\\">\\n\\t**Version management has two layers:**\\n\\t1. **Soft update toast** (dismissible, Firebase) \u2014 shown when a newer app version exists but the `state_version_id` is the same. No gameplay impact. User can tap \\\"Later\\\".\\n\\t2. **Forced update popup** (blocking) \u2014 shown **only when 2+ devices are connected AND ****`state_version_id`**** differs** between the device and the server\u2019s `current_state_version_id`. The older device must update before it can play. Single-device users are never forced to update \u2014 they see only the soft toast.\\n</callout>\\n## 6.1 State Version Bucketing (Server-Side)\\nApp versions are grouped into **state version buckets**. All versions in the same bucket share the same state schema and can sync freely. When the server-side `current_state_version_id` is bumped, devices on older buckets must update.\\n<callout icon=\\\"\ud83d\udd11\\\" color=\\\"blue_bg\\\">\\n\\t**Core rule:** Forced update is triggered **only when both conditions are true:**\\n\\t1. Device\u2019s `state_version_id` \u2260 server\u2019s `current_state_version_id`\\n\\t2. **2 or more devices** are bound to the same platform account\\n\\tIf only 1 device is connected, the state_version_id mismatch is harmless (no other device writing a different schema). The user sees only the **soft update toast**.\\n</callout>\\n### Configuration\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Parameter**</td>\\n<td>**Type**</td>\\n<td>**Description**</td>\\n<td>**Example**</td>\\n</tr>\\n<tr>\\n<td>`state_version_buckets`</td>\\n<td>Map (server-side config)</td>\\n<td>Maps app versions to a `state_version_id`. All app versions sharing the same ID have compatible state schemas.</td>\\n<td>`{ \\\"0.38.200\\\": 1, \\\"0.38.210\\\": 1, \\\"0.38.220\\\": 1, \\\"0.38.300\\\": 2 }`</td>\\n</tr>\\n<tr>\\n<td>`current_state_version_id`</td>\\n<td>Integer (server-side config)</td>\\n<td>The state version ID that is currently required. Any device whose app version maps to a **different** state_version_id must update (forced update popup).</td>\\n<td>`2`</td>\\n</tr>\\n<tr>\\n<td>`cloud_save_excluded_versions`</td>\\n<td>Array of String (optional)</td>\\n<td>Specific versions to exclude (e.g., known-broken builds). Rarely used.</td>\\n<td>`[\\\"0.38.050\\\"]`</td>\\n</tr>\\n</table>\\n### How it works\\n1. Every app version is mapped to a `state_version_id` in `state_version_buckets` (server-side config, no code deploy)\\n2. The server maintains a `current_state_version_id` \u2014 the active bucket\\n3. On every login / background return, the client checks: does my app version\u2019s `state_version_id` match `current_state_version_id`?\\n\\t- The server first checks `state_version_overrides` (emergency override map). If the app version has an override, that `state_version_id` is used instead of the one in `state_version_buckets`.\\n4. **Match** \u2192 normal cloud save\\n5. **Mismatch** \u2192 forced update flow (Section 6.2)\\n6. **App version not in the map at all** (very old build) \u2192 same as mismatch\\n### Example\\n```plain text\\nServer config:\\n  state_version_buckets: { \\\"0.38.200\\\": 1, \\\"0.38.210\\\": 1, \\\"0.38.220\\\": 1, \\\"0.38.300\\\": 2, \\\"0.38.310\\\": 2 }\\n  current_state_version_id: 1\\n\\nDevice A on v0.38.210 \u2192 state_version_id = 1 \u2192 matches current (1) \u2192 \u2705 normal sync\\nDevice B on v0.38.220 \u2192 state_version_id = 1 \u2192 matches current (1) \u2192 \u2705 normal sync\\nDevice C on v0.38.300 \u2192 state_version_id = 2 \u2192 does NOT match current (1) \u2192 \u2705 also fine\\n  (Device C is on a newer bucket \u2014 it can sync because it\u2019s forward-compatible)\\n\\nLater, server bumps: current_state_version_id: 2\\n  (a breaking schema change shipped in v0.38.300)\\n\\nDevice A on v0.38.210 \u2192 state_version_id = 1 \u2192 does NOT match current (2)\\n  Is Device A the only connected device?\\n    YES (1 device) \u2192 \u2705 Soft update toast only. Can keep playing. No forced update.\\n    NO (2+ devices, e.g. Device C on bucket 2 is also bound) \u2192 \u274c Forced Update Popup. Must update.\\nDevice B on v0.38.220 \u2192 same as A \u2192 \u274c Update Popup\\nDevice C on v0.38.300 \u2192 state_version_id = 2 \u2192 matches current (2) \u2192 \u2705 normal sync\\n```\\n### When the player\u2019s version is outside all buckets\\n- **Never-connected players:** Feature invisible. No toast. They don\u2019t know cloud save exists.\\n- **Previously-connected players:** forced update flow (Section 6.2). They ALWAYS get the prompt.\\n### Silent vs Update Prompt \u2014 When the player was previously connected\\n<callout icon=\\\"\u2757\\\" color=\\\"red_bg\\\">\\n\\t**Key rule:** If the installed version is out of the supported range, the player sees a **forced update popup** with only an \\\"Update Now\\\" button. No decline option. <br><br>Silent (no UI) behavior only applies to players who **never connected** to cloud save on any device \u2014 they simply don't see the feature at all.\\n</callout>\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Condition**</td>\\n<td>**Was previously connected?**</td>\\n<td>**What happens**</td>\\n</tr>\\n<tr>\\n<td>Version out of range, **never connected**</td>\\n<td>No</td>\\n<td>**Silent.** Feature invisible. No popup, no badge, no toast. Player doesn't know cloud save exists.</td>\\n</tr>\\n<tr>\\n<td>Version out of range, **was connected before**</td>\\n<td>Yes</td>\\n<td>**Forced update popup shown.** Only \\\"Update Now\\\" button. No decline. Blocks gameplay until updated.</td>\\n</tr>\\n<tr>\\n<td>Version in `cloud_save_excluded_versions`, **was connected**</td>\\n<td>Yes</td>\\n<td>Same as above. Server alert also fires (likely config mistake).</td>\\n</tr>\\n<tr>\\n<td>Version in `cloud_save_excluded_versions`, **never connected**</td>\\n<td>No</td>\\n<td>**Silent.** Feature invisible.</td>\\n</tr>\\n</table>\\n### Login Scenarios by Version\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Scenario**</td>\\n<td>**Behavior**</td>\\n</tr>\\n<tr>\\n<td>All devices in supported range</td>\\n<td>Normal sync \u2014 single-state, last-write-wins, login-check ownership (Section 5)</td>\\n</tr>\\n<tr>\\n<td>Only current device (A) in range</td>\\n<td>A runs normal login check / save; B will see update prompt when opened</td>\\n</tr>\\n<tr>\\n<td>Only other device (B) in range + A is out of range</td>\\n<td>A (was connected): **forced update popup**. A (never connected): **silent** \u2014 feature unavailable.</td>\\n</tr>\\n<tr>\\n<td>Device version out of supported range</td>\\n<td>Was connected: **forced update popup** (Section 6.2). Never connected: **silent**.</td>\\n</tr>\\n</table>\\n## 6.1b Silent Disconnect Protection\\n<callout icon=\\\"\ud83d\udee1\ufe0f\\\" color=\\\"red_bg\\\">\\n\\t**With the forced update flow, there is no path to disconnection from a version mismatch.** The user must update \u2014 the popup blocks all gameplay. Silent disconnect only applies to users who never connected.\\n</callout>\\n### Layer 1 \u2014 Prevention: Supported range is configured server-side\\nNew versions should be added to the supported range at ship time. A newer version that is accidentally outside the range is treated as a config mistake: the player sees the update prompt immediately on open.\\n### Layer 2 \u2014 Detection: Server-side alert on excluded newer version\\nWhen the server receives a login from a device whose version is newer than the configured range (almost always a config mistake):\\n1. Fires `technical_cloud_save_version_disconnected` BI event\\n2. Triggers an alert to the team slack, see 9.4 Server-Side Alerts Slack</mention-page> \\n3. The player is routed to the Section 6.2 forced update flow. The team can correct the range server-side, after which the player no longer sees the prompt on next open.\\n### Layer 3 \u2014 Data protection: Single state + support recovery\\nBecause the server holds only one state and never runs comparison, there is nothing to update incorrectly. The original cloud state is always preserved on the server.\\n---\\n## 6.2 Forced Update - State Version Mismatch + Multi-Device\\nTriggered when **both** conditions are met:\\n1. Device\u2019s `state_version_id` \u2260 server\u2019s `current_state_version_id`\\n2. **2+ devices** are bound to the same platform account\\nThe user **must update**. There is no decline option. The popup blocks gameplay until the user updates.\\n**If only 1 device is connected**, the mismatch does NOT trigger forced update \u2014 the user sees only the soft update toast (Section 6.3) and can continue playing normally.\\n### 6.2.1 Flow\\n1. **Forced Update popup** shown (blocking \u2014 no dismiss, no X, no tap-outside):\\n\\t- Header: **\\\"Update Required\\\"**\\n\\t- Body: **\\\"A new version is required to continue playing. Update now to keep your progress synced.\\\"**\\n\\t- Single button: **\\\"Update Now\\\"** \u2192 opens App Store / Play Store\\n2. **\\\"Update Now\\\"** \u2192 store opens. After updating, the app relaunches in the supported range \u2192 normal login / sync resumes.\\n3. If the user closes the store without updating and returns to the game \u2192 **the forced update popup is shown again**. The popup persists on every app open / BG return until the version matches.\\n## 6.3 Soft Update \u2014 In-App Update Prompt (Separate System)\\nThe  is a **separate, independent system** controlled via Firebase Remote Config:\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Key**</td>\\n<td>**Type**</td>\\n<td>**Purpose**</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_enabled`</td>\\n<td>Boolean</td>\\n<td>Global kill switch</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_min_version`</td>\\n<td>String</td>\\n<td>users below this see the soft prompt</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_target_version`</td>\\n<td>String</td>\\n<td>Shown in dialog copy</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_cooldown_hours`</td>\\n<td>Number</td>\\n<td>Hours between re-prompts (default: 24)</td>\\n</tr>\\n</table>\\nThis is **soft** (dismissible, with cooldown). user can tap \\\"Later.\\\"\\n## 6.4 Priority & Interaction\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Condition**</td>\\n<td>**Which Prompt**</td>\\n<td>**Behavior**</td>\\n</tr>\\n<tr>\\n<td>Version out of supported range</td>\\n<td>**Forced update popup**</td>\\n<td>**Forced update** (only when state_version_id mismatch + 2+ devices). Blocks gameplay. Single-device users see soft toast only.</td>\\n</tr>\\n<tr>\\n<td>Version is outdated but still in supported range</td>\\n<td>**Soft in-app update prompt**</td>\\n<td>Dismissible. Cooldown-based. \\\"Later\\\" button. Does not affect cloud save.</td>\\n</tr>\\n<tr>\\n<td>**Both** conditions true</td>\\n<td>**Cloud save prompt takes priority**</td>\\n<td>Cloud save prompt shown first (more urgent \u2014 the player must update). Soft prompt suppressed until version is back in range.</td>\\n</tr>\\n</table>\\n## 6.5 State Schema Migration\\nWhen loading a cloud save, the system checks `state_schema_version`:\\n- **Server schema older** \u2192 Run migration transform to convert state to current schema. If migration fails, treat as corrupted (fallback chain). BI event `technical_cloud_save_schema_migration` sent.\\n- **Server schema newer than app understands** \u2192 App is outdated. Route to **Section 6.2 forced update flow** (no decline option).\\n- **Schemas match** \u2192 Continue normally.\\n---\\n# 7. User Flows \u2014 Step-by-Step with UI\\n```mermaid\\nflowchart TD\\n    FF{multi_device_sync_enabled?} -->|Off| XX[Multi-device sync disabled - state still saves locally + server]\\n    FF -->|On| A[App Opens]\\n    A --> B{Signed into platform?}\\n    B -->|Yes| C[Silent bind + upload]\\n    B -->|No| D[Guest mode - retry every launch]\\n    C --> E{state_version_id = current?}\\n    E -->|Yes| F[Normal sync + Sync Toast]\\n    E -->|No| V{2+ devices connected?}\\n    V -->|No - single device| ST[Soft update toast - dismissible]\\n    ST --> F\\n    V -->|Yes - multi device| G[Forced Update Popup - blocking]\\n    G -->|Update Now| H[Store - update - relaunch]\\n    H --> F\\n    G -->|Returns without updating| G\\n\\n    F --> K{Return from BG - Login check}\\n    K -->|Still owner| L[Signed-In Toast 1s]\\n    K -->|Session taken| M[Another Device popup]\\n    M -->|Re-login| N[Load server state]\\n\\n    F --> O{Connection drops?}\\n    O -->|Yes| P[Offline Toast - progress may be lost]\\n    P --> Q{Reconnect}\\n    Q -->|Still owner| R[Push local state]\\n    Q -->|Session taken| M\\n\\n    style F fill:#d4edda,stroke:#28a745\\n    style L fill:#d4edda,stroke:#28a745\\n    style R fill:#d4edda,stroke:#28a745\\n    style N fill:#d4edda,stroke:#28a745\\n    style P fill:#fff3cd,stroke:#ffc107\\n    style G fill:#f8d7da,stroke:#dc3545\\n    style ST fill:#fff3cd,stroke:#ffc107\\n    style V fill:#e8e8e4,stroke:#999\\n    style M fill:#cce5ff,stroke:#0d6efd\\n    style XX fill:#f0f0f0,stroke:#999\\n```\\n<callout icon=\\\"\ud83c\udfa8\\\" color=\\\"blue_bg\\\">\\n\\t**Figma wireframes:** [https://www.figma.com/design/BI7JJI7lvTTO3zPfz935AH/](https://www.figma.com/design/BI7JJI7lvTTO3zPfz935AH/)\\n\\tEach flow references specific Figma screens. Screens marked **NEW** need design from **Dean** before implementation.\\n</callout>\\n## Figma Screen Inventory\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**#**</td>\\n<td>**Screen**</td>\\n<td>**Status**</td>\\n<td>**Notes**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Sync Toast</td>\\n<td>**Keep as-is**</td>\\n<td>\\\"\u2713 Progress synced via Game Center\\\" (3s, one-time)</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>Signed-In Toast</td>\\n<td>**Keep as-is**</td>\\n<td>\\\"Signed in \u00b7 Progress saved\\\" (1s, every BG return)</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Forced Update Popup</td>\\n<td>**Redesign needed**</td>\\n<td>Blocking popup with single \\\"Update Now\\\" button. Shown only when state_version_id mismatch + 2+ devices. No dismiss.</td>\\n</tr>\\n<tr>\\n<td>4</td>\\n<td>Offline Toast</td>\\n<td>**Update copy**</td>\\n<td>New: **\\\"No internet connection. Your progress may be lost.\\\"**</td>\\n</tr>\\n<tr>\\n<td>5</td>\\n<td>Not-Syncing Toast</td>\\n<td>**REMOVE**</td>\\n<td>No longer exists in the new model.</td>\\n</tr>\\n<tr>\\n<td>6</td>\\n<td>Welcome Back Toast</td>\\n<td>**Keep as-is**</td>\\n<td>\\\"Welcome back! Progress restored via Game Center\\\" (3s)</td>\\n</tr>\\n<tr>\\n<td>9</td>\\n<td>\\\"Another Device\\\" Popup</td>\\n<td>**NEW \u2014 Dean**</td>\\n<td>Blocking: \\\"Another device is logged in. Re-login to get your last known progress.\\\"</td>\\n</tr>\\n</table>\\n---\\n## Flow 1: First Launch\\n**Trigger:** App opens for the first time.\\n### Path A \u2014 Signed into platform\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>App opens</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>System silently detects platform account</td>\\n<td>\u2014 (invisible)</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Platform account linked to distinct_id</td>\\n<td>\u2014</td>\\n<td>`platform_bindings` created</td>\\n</tr>\\n<tr>\\n<td>4</td>\\n<td>Local progress uploaded as initial server state</td>\\n<td>\u2014</td>\\n<td>`active_states` created</td>\\n</tr>\\n<tr>\\n<td>5</td>\\n<td>First-sync confirmation</td>\\n<td>**Sync Toast** (Figma #1): \\\"\u2713 Progress synced via Game Center\\\" (3s)</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>6</td>\\n<td>Normal gameplay. Auto-save every N sec.</td>\\n<td>\u2014</td>\\n<td>Heartbeat starts</td>\\n</tr>\\n</table>\\n### Path B \u2014 NOT signed in\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Platform not detected</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>Guest mode. Local + DB saves.</td>\\n<td>**Nothing.** Player doesn't know cloud save exists.</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Retries silently every future launch</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>4</td>\\n<td>Once signed in \u2192 Path A runs</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n</table>\\n### Path C \u2014 Mid-FTUE\\nPlatform connection in background. Sync held until tutorial finishes. Once FTUE ends \u2192 sync + **Sync Toast**.\\n### Example \u2014 first launch, signed in\\n```plain text\\nthe user installs Merge Cruise on an iPhone. the user signed into Game Center.\\n\\n  What the user sees sees:\\n  1. App opens normally \u2014 no login screen, no popup, no loading bar.\\n  2. After a few seconds, a small green toast appears at the top:\\n     \\\"\u2713 Progress synced via Game Center\\\"\\n     It disappears after 3 seconds. \\n     Each login and back from background the user will see the system toast\\n```\\n---\\n## Flow 2: Return from Background\\n**Trigger:** Player returns to the app from background. Login check determines if this device still owns the session.\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>App returns to foreground</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>Login check runs: is this device still the session owner?</td>\\n<td>\u2014</td>\\n<td>Check `current_login_device_id`</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Still owner \u2192 load server state, resume play</td>\\n<td>**Signed-In Toast** (Figma #2): \\\"Signed in \u00b7 Progress saved\\\" (1s)</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>3 alt</td>\\n<td>Session actively taken over while in BG \u2192 popup</td>\\n<td>**\\\"Another Device\\\" Popup** (Figma #9)</td>\\n<td>\u2014</td>\\n</tr>\\n</table>\\n### Example \u2014 return from background, still owner\\n```plain text\\nSarah puts Merge Cruise in the background to answer a text. She comes back 2 minutes later.\\n\\n  What Sarah sees:\\n  1. Game resumes. A tiny toast flashes for 1 second: \\\"Signed in \u00b7 Progress saved\\\".\\n  2. She continues playing exactly where she left off. Nothing else happens.\\n```\\n### Example \u2014 return from background, another device took over\\n```plain text\\nSarah puts the game in background. Meanwhile, her son opens the game on the iPad.\\nSarah comes back to the game 10 minutes later while her son is still active.\\n\\n  What Sarah sees:\\n  1. A popup blocks the screen: \\\"Another device is logged in.\\n     Re-login to get your last known progress.\\\"\\n  2. She taps \\\"Re-login\\\".\\n  3. The game loads the latest state (whatever her son played to on the iPad).\\n  4. She continues from there. \\n  5. Her Son, in case he is still active will get the \\\"Another device is logged in. Relogin to get the last know progress.\\\"\\n```\\n---\\n## Flow 3: Reinstall / New Device\\n**Trigger:** Fresh install, player signed into platform.\\n### Path A \u2014 Cloud save exists, version OK\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Game installed \u2192 privacy prompts</td>\\n<td>OS prompts</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>Platform detected \u2192 cloud save found</td>\\n<td>\u2014</td>\\n<td>Lookup bindings \u2192 states</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Version check passes</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>4</td>\\n<td>Login check \u2192 claim session</td>\\n<td>\u2014</td>\\n<td>`session_locks` updated</td>\\n</tr>\\n<tr>\\n<td>5</td>\\n<td>FTUE skipped. Cloud save loaded.</td>\\n<td>**Welcome Back Toast** (Figma #6): \\\"Welcome back!\\\" (3s)</td>\\n<td>\u2014</td>\\n</tr>\\n</table>\\n### Path B \u2014 Version NOT in range\\nVersion check fails \u2192 go to **Flow 4** (Forced Update).\\n### Path C \u2014 No cloud save\\nNormal fresh start \u2192 existing FTUE flow.\\n### Example \u2014 reinstall on a new phone\\n```plain text\\nSarah gets a new iPhone. Signs into the same Game Center account.\\n\\n  What Sarah sees:\\n  1. App opens \u2014 standard iOS privacy/notification prompts.\\n  2. NO tutorial. The game skips straight to the lobby.\\n     She\u2019s back at chapter 25 with all her progress.\\n  3. A toast appears: \\\"Welcome back! Progress restored via Game Center\\\" (3s).\\n  4. That\u2019s it. She continues playing as if nothing happened.\\n```\\n---\\n## Flow 4: Version Mismatch (Soft Toast or Forced Update)\\n**Trigger:** A newer app version exists OR `state_version_id` mismatches.\\n- **Same ****`state_version_id`** (non-breaking update available): soft update toast (dismissible). User keeps playing.\\n- **Different ****`state_version_id`**** + only 1 device connected**: soft update toast (dismissible). No risk of schema conflict.\\n- **Different ****`state_version_id`**** + 2+ devices connected**: **forced update popup** (blocking). Must update.\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Version check: is there a newer version or state_version_id mismatch?</td>\\n<td>\u2014</td>\\n<td>Check `state_version_buckets`  \u2022 `current_state_version_id`  \u2022 connected device count</td>\\n</tr>\\n<tr>\\n<td>2a</td>\\n<td>**Same state_version_id** (or mismatch but only 1 device): soft update toast</td>\\n<td>**Soft Update Toast** (dismissible): \\\"Update available\\\" + \\\"Later\\\" button</td>\\n<td>User keeps playing. Toast re-shown after cooldown.</td>\\n</tr>\\n<tr>\\n<td>2b</td>\\n<td>**Different state_version_id + 2+ devices**: forced update popup</td>\\n<td>**Forced Update Popup** (Figma #3): \\\"Update Required\\\" with single \\\"Update Now\\\" button. No decline.</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Player taps **\\\"Update Now\\\"** \u2192 store opens</td>\\n<td>App Store / Play Store</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>3 alt</td>\\n<td>User closes store without updating \u2192 returns to game</td>\\n<td>**Forced Update Popup shown again.** Persists until updated.</td>\\n<td>\u2014</td>\\n</tr>\\n</table>\\n---\\n## Flow 5: Connection Lost Mid-Session\\n**Trigger:** Internet drops during gameplay (heartbeat cannot reach server).\\n### Path A \u2014 Reconnects, still session owner\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Heartbeat fails</td>\\n<td>\u2014</td>\\n<td>Session becomes stale</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>Client detects loss</td>\\n<td>**Offline Toast** (Figma #4): **\\\"No internet connection. Your progress may be lost.\\\"** Visible while offline.</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Gameplay continues locally. Nothing uploaded.</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>4</td>\\n<td>Silent retries (5s \u2192 10s \u2192 20s \u2192 60s)</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>5</td>\\n<td>Connection restored</td>\\n<td>Toast disappears</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>6</td>\\n<td>Login check \u2192 still owner \u2192 push local state</td>\\n<td>\u2014</td>\\n<td>`active_states` updated (delta)</td>\\n</tr>\\n</table>\\n### Path B \u2014 Another device logged in while offline\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1\u20134</td>\\n<td>Same as Path A (offline, local play)</td>\\n<td>**Offline Toast**</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>5</td>\\n<td>Connection restored</td>\\n<td>Toast disappears</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>6</td>\\n<td>Login check \u2192 session owner is now Device B</td>\\n<td>**\\\"Another Device\\\" Popup** (Figma #9): \\\"Another device is logged in. Re-login to get your last known progress.\\\"</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>7</td>\\n<td>\\\"Re-login\\\" \u2192 claim session \u2192 load server state (from B)</td>\\n<td>\u2014</td>\\n<td>Session transfers</td>\\n</tr>\\n<tr>\\n<td>8</td>\\n<td>**Local offline progress is discarded** (not uploaded, not compared)</td>\\n<td>\u2014</td>\\n<td>`technical_cloud_save_forced_relogin` BI</td>\\n</tr>\\n</table>\\n### Example \u2014 offline, reconnects as owner\\n```plain text\\nSarah is playing on the train. The tunnel kills her connection.\\n\\n  What Sarah sees:\\n  1. A toast appears at the bottom: \\\"No internet connection. Your progress may be lost.\\\"\\n     It stays visible.\\n  2. She keeps playing \u2014 nothing is blocked. She completes 3 board tasks.\\n  3. The train exits the tunnel. Connection restored.\\n  4. The toast disappears. Her progress is saved to the server.\\n  5. She continues as normal. No popups, no interruptions.\\n```\\n### Example \u2014 offline, another device logged in meanwhile\\n```plain text\\nSarah loses connection on the train. Meanwhile, her son opens the game on the iPad.\\n\\n  What Sarah sees:\\n  1. Toast: \\\"No internet connection. Your progress may be lost.\\\"\\n  2. She keeps playing locally for 20 minutes.\\n  3. Connection comes back. Toast disappears.\\n  4. BUT: a popup blocks the screen:\\n     \\\"Another device is logged in. Re-login to get your last known progress.\\\"\\n  5. She taps \\\"Re-login\\\".\\n  6. The game loads the iPad\u2019s state (what her son played to).\\n     Sarah\u2019s 20 minutes of offline progress is gone.\\n     (The offline toast warned her: \\\"your progress may be lost.\\\")\\n```\\n### Example \u2014 A has flaky network while B plays concurrently\\n```plain text\\nSarah is playing on her iPhone with a flaky 3G connection.\\nSome of her saves reach the server, others fail silently.\\nMeanwhile, her son opens the game on the iPad (stable WiFi) and starts playing.\\nBoth devices are actively trying to play at the same time.\\n\\n  What Sarah sees on the iPhone:\\n  1. iPad logs in and takes over the session.\\n  2. iPhone\u2019s next save returns SESSION_INVALIDATED (session stolen mid-save).\\n  3. Toast: \\\"No internet connection. Your progress may be lost.\\\"\\n     (From the iPhone\u2019s perspective, the save failed \u2014 it looks like offline.)\\n  4. She keeps tapping, but nothing saves to the server.\\n  5. She backgrounds the app briefly.\\n  6. On return: login check \u2192 session owner is iPad \u2192 popup:\\n     \\\"Another device is logged in. Re-login to get your last known progress.\\\"\\n  7. She taps \\\"Re-login\\\" \u2192 loads iPad\u2019s latest state.\\n  8. Any saves the iPhone made during the flaky window that DID reach the\\n     server were already overwritten by the iPad\u2019s newer writes\\n     (last-write-wins).\\n```\\n---\\n## Flow 6: Multi-Device \u2014 Login Check (Newer Login Wins)\\n**Trigger:** A second device opens the app while another was session owner.\\n### Scenario A \u2014 Sequential switching (seamless, no popup)\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Device A plays and saves (owner)</td>\\n<td>\u2014</td>\\n<td>Heartbeat active A</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>Player closes A, opens B</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>B login check \u2192 claims session</td>\\n<td>\u2014</td>\\n<td>`current_login_device_id = B`</td>\\n</tr>\\n<tr>\\n<td>4</td>\\n<td>B loads server state, plays and saves</td>\\n<td>\u2014</td>\\n<td>`active_states` updated (delta) by B</td>\\n</tr>\\n<tr>\\n<td>5</td>\\n<td>Player opens A. A\u2019s session had expired (was closed). Login check: no active session.</td>\\n<td>**No popup.** Loads chapter 27 from server. Normal gameplay.</td>\\n<td>A claims new session, loads latest state</td>\\n</tr>\\n</table>\\n### Scenario B \u2014 Both open simultaneously\\nBoth devices have active sessions. Whichever logs in later becomes owner. The device that loses its active session sees the **\\\"Another Device\\\" Popup**. \\n<callout icon=\\\"\ud83d\udcf1\\\" color=\\\"blue_bg\\\">\\n\\t**More than 2 devices supported.** The login check model works with any number of devices bound to the same platform account. Only one device holds the session at a time. Devices whose active sessions were taken over see the popup. Devices that were already closed simply load the latest server state on next open \u2014 no popup. The server tracks the single `current_login_device_id`; it does not limit the number of bound devices.\\n</callout>\\n### Example \u2014 switching between two devices\\n```plain text\\nSarah plays on her iPhone (Device A) to chapter 25 and closes the app.\\nShe picks up her iPad (Device B) and opens the game.\\n\\n  What Sarah sees on the iPad:\\n  1. Game opens. Loads chapter 25 (from the server). Normal gameplay.\\n  2. She plays to chapter 27 on the iPad. Closes the iPad.\\n\\n  Later, she opens the iPhone again.\\n\\n  What Sarah sees on the iPhone:\\n  1. Game opens. Loads chapter 27 (from the server). Normal gameplay.\\n  2. No popup. No re-login. Her iPhone session had already expired\\n     when she closed it \u2014 this is just a normal app open.\\n  3. She continues from chapter 27. Truly seamless.\\n```\\n### Example \u2014 both devices active (popup)\\n```plain text\\nSarah is playing on her iPhone (chapter 25, session active).\\nShe picks up her iPad WITHOUT closing the iPhone (iPhone is in background,\\nsession still alive for a few seconds).\\n\\nThe iPad opens and takes over the session. Sarah plays to chapter 27.\\n\\nWithin a couple of seconds, Sarah switches back to her iPhone.\\n\\n  What Sarah sees on the iPhone:\\n  1. A popup: \\\"Another device is logged in.\\n     Re-login to get your last known progress.\\\"\\n  2. She taps \\\"Re-login\\\".\\n  3. Game loads chapter 27 (iPad\u2019s state).\\n  4. She continues from chapter 27.\\n\\n  (The popup appeared because the iPhone had an active session that was\\n   taken over. If she had waited longer than ~3 seconds, her session would\\n   have expired and she would have gotten no popup \u2014 just a seamless load.)\\n\\n\\n```\\n---\\n## Flow 7: Platform Sign-Out / Sign-In (OS-Level)\\n### Sign-Out\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Platform signed out (OS callback)</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>New `distinct_id` generated</td>\\n<td>\u2014</td>\\n<td>`device_id_history` updated</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Cloud sync stops. Continues as guest.</td>\\n<td>**Nothing.** Silent.</td>\\n<td>Cloud state preserved on server</td>\\n</tr>\\n</table>\\n### Sign Back In (same account)\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Step**</td>\\n<td>**What happens**</td>\\n<td>**UI shown**</td>\\n<td>**Server**</td>\\n</tr>\\n<tr>\\n<td>1</td>\\n<td>Player signs back in</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>2</td>\\n<td>Login check \u2192 claim session \u2192 load server state</td>\\n<td>**Nothing.** Silent.</td>\\n<td>Session ownership transfers</td>\\n</tr>\\n<tr>\\n<td>3</td>\\n<td>Local guest progress NOT merged. Only the server state is loaded.</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n</tr>\\n</table>\\n### Example \u2014 platform sign-out and sign back in\\n```plain text\\nSarah goes to iPhone Settings and signs out of Game Center (for some reason).\\n\\n  What Sarah sees:\\n  1. Nothing in the game changes. She\u2019s still at chapter 25.\\n  2. She keeps playing. But behind the scenes, cloud sync has stopped.\\n     A new guest account was created silently.\\n  3. She plays to chapter 28 as a guest.\\n\\n  A week later, she signs back into Game Center in Settings.\\n\\n  What Sarah sees:\\n  1. Game opens normally. No popup, no toast.\\n  2. BUT: the game loads chapter 25 (the last cloud-saved state),\\n     not chapter 28 (her guest progress).\\n  3. Her 3 chapters of guest progress are NOT merged.\\n     Her 3 chapters of guest progress are lost (no merge).\\n```\\n---\\n# 8. Session Ownership (Heartbeat + Login Check)\\n### How It Works\\n1. Device registers heartbeat: `POST /session/heartbeat` every **X** **seconds** (configurable via `heartbeat_interval_seconds`).\\n2. Server stores: `distinct_id`, `device_id`, `last_heartbeat_timestamp`, `current_login_device_id`.\\n3. Session is **active** if `last_heartbeat < 3 seconds ago` (configurable via `session_stale_threshold_seconds`).\\n4. **Login check** runs on every app open and return from background. Three outcomes:\\n\\t- Still owner \u2192 continue.\\n\\t- Session was taken over (this device had an active heartbeat when another device claimed ownership) \u2192 show popup, re-login required.\\n\\t- Device was inactive (session expired) \u2192 silently claim new session, load server state. No popup.\\n### When Device B logs in while Device A is active\\n1. Device B logs in \u2192 server sets `current_login_device_id = B`.\\n2. Device A's next heartbeat / save returns `SESSION_INVALIDATED` \u2192 stops saving.\\n3. If Device A returns from background **while its session was still alive** (within `session_stale_threshold`), it sees: **\\\"Another device is logged in. Re-login to get your last known progress.\\\"** If A was already closed or its session expired, opening A later simply loads the latest server state \u2014 no popup.\\n### Key Rules\\n- Heartbeat does not \\\"fight\\\" the other device. Ownership changes **only on login**, not on heartbeat.\\n- Max state loss on takeover = whatever Device A had not yet saved at the moment B logged in; that local work is discarded (last-write-wins; no merge).\\n- The \\\"No internet connection. Your progress may be lost.\\\" toast is what warns players about this upfront.\\n- Session ownership is server-side only \u2014 clients don't coordinate.\\n---\\n# 9. Safety & Recovery\\n## 9.1 State Handling (no archival)\\n- The server stores exactly **one active state per user**. Every save overwrites it.\\n- Only one active state per user.\\n- Support recovery relies on: (a) BI event logs + admin restore tool, (b) platform-level backups outside the scope of this PRD, (c) `state_history` for rollback to any previous save.\\n## 9.2 Corruption Detection\\n- Every state validated before loading (SHA-256 checksum).\\n- Fallback chain: cloud \u2192 local \u2192 `state_history` (previous saves) \u2192 auto support ticket.\\n## 9.3 Admin Restore Tooling\\nSupport team must have:\\n1. **Search** by `distinct_id`, `platform_id`, or `device_id`.\\n2. **View write log** \u2014 BI-backed log of saves / login checks / takeovers (not a rollbackable state history).\\n3. **Restore from ****`state_history`** \u2014 roll back to any previous state save.\\n4. **Investigate sync issues** \u2014 trace events across devices for a given `platform_account_id`.\\n5. **Bulk operations** via CSV for incidents affecting multiple users.\\n---\\n## 9.4 Server-Side Alerts Slack\\nThese alerts are **server-side only** \u2014 not part of the client code. They fire to the team\u2019s Slack channel when anomalies are detected.\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Alert**</td>\\n<td>**Trigger**</td>\\n<td>**Severity**</td>\\n<td>**Action**</td>\\n</tr>\\n<tr>\\n<td>Save failure spike</td>\\n<td>`technical_state_save_failure` rate exceeds 1**% of active users** in a 15-min window</td>\\n<td>P0 \u2014 Critical</td>\\n<td>Investigate server health / DB load. Consider pausing saves if data corruption risk.</td>\\n</tr>\\n<tr>\\n<td>Corruption spike</td>\\n<td>`technical_state_corruption_detected` count exceeds **50 in 1 hour**</td>\\n<td>P0 \u2014 Critical</td>\\n<td>Investigate root cause. Use `state_history` for restore. Prepare bulk restore.</td>\\n</tr>\\n<tr>\\n<td>Newer version excluded</td>\\n<td>`technical_cloud_save_version_disconnected` fires for a version **newer** than `current_state_version_id` (likely config mistake)</td>\\n<td>P1 \u2014 High</td>\\n<td>Check `state_version_buckets` config \u2014 a new build was probably shipped without being added to the map.</td>\\n</tr>\\n<tr>\\n<td>Forced update surge</td>\\n<td>`impression_cloud_save_update_popup` count exceeds **1000 in 1 hour** (unexpected mass version mismatch)</td>\\n<td>P1 \u2014 High</td>\\n<td>Verify `current_state_version_id` was intentionally bumped. If accidental \u2014 revert server config.</td>\\n</tr>\\n<tr>\\n<td>Login check failure rate</td>\\n<td>`technical_state_login_check` with `action = show_relogin_popup` exceeds **5% of total login checks** in 1 hour</td>\\n<td>P1 \u2014 High</td>\\n<td>Possible session ownership bug or race condition. Investigate heartbeat / session_locks behavior.</td>\\n</tr>\\n<tr>\\n<td>Connection failure rate</td>\\n<td>`technical_cloud_save_connection_failure` rate exceeds **5 % of connection attempts** in a 1-hour window</td>\\n<td>P2 \u2014 Medium</td>\\n<td>Check platform service status (Game Center / Google Play outage?). No user action needed \u2014 retries will recover.</td>\\n</tr>\\n<tr>\\n<td>Heartbeat timeout rate</td>\\n<td>Stale sessions (no heartbeat for \\\\> `session_stale_threshold_seconds`) exceed **5% of active sessions**</td>\\n<td>P2 \u2014 Medium</td>\\n<td>Possible network degradation or client crash loop. Cross-reference with crash reports.</td>\\n</tr>\\n</table>\\n### Alert implementation notes\\n- All alerts are BQ-based queries running on a **15-minute cron** (or real-time via the RT Mixpanel Collector for P0 alerts)\\n- Thresholds are configurable server-side \u2014 start conservative and tune based on baseline data after launch\\n- P0 alerts page the on-call engineer; P1/P2 go to Slack only\\n- Each alert includes: event count, affected user count, time window, top affected app versions\\n---\\n# 10. UI Elements \u2014 Complete Summary\\n<callout icon=\\\"\ud83d\udc49\\\" color=\\\"yellow_bg\\\">\\n\\t**See Section 7 (Figma Screen Inventory table) for the full list of screens, their status (keep / redesign / new), and Figma references.** The descriptions below provide copy and behavior details.\\n</callout>\\n## Sync Toast (shown once) \u2014 Figma #1\\n- **When:** First successful cloud sync ever\\n- **Copy (iOS):** \\\"\u2713 Progress synced via Game Center\\\" \\\\| **(Android):** \\\"\u2713 Progress synced via Google Play Games\\\" \\\\| **(reinstall):** \\\"Welcome back! Progress restored via ...\\\"\\n- **Behavior:** Auto-dismisses after 3 seconds. Waits for natural pause if mid-gameplay.\\n## Signed-In Confirmation Toast (every return from background) \u2014 Figma #2\\n- **Duration:** 1 second. Confirms user is signed in and progress is being saved.\\n## Forced Update Popup (multi-device only)\\n- **When:** `state_version_id` \u2260 `current_state_version_id` **AND** 2+ devices are bound to the platform account. Shown on **every app open and BG return** until updated.\\n- **What:** Centered popup, dimmed overlay. **Not dismissible** \u2014 no X, no tap-outside, no secondary button.\\n- **Header:** \\\"Update Required\\\"\\n- **Body:** \\\"A new version is required to continue playing. Update now to keep your progress synced.\\\"\\n- **Single button:** **\\\"Update Now\\\"** \u2192 opens App Store / Play Store.\\n- **Behavior:** If user returns from store without updating, popup re-appears. Blocks all gameplay.\\n- **Single-device users** with the same mismatch see only the **soft update toast** (Section 6.3) \u2014 dismissible, no blocking.\\n## Offline Toast (mid-session only)\\n- **When:** Connection drops mid-session (heartbeat cannot reach server). **NOT** on app launch (existing error popup handles that).\\n- **Copy:** **\\\"No internet connection. Your progress may be lost.\\\"**\\n- **Behavior:** Visible while offline. Reappears on every background return while offline. Disappears on reconnect. Not shown during FTUE or for guest users. Retries happen silently; on reconnect the device reconnects and saves the current local state as the next write (if it still owns the session).\\n## \\\"Another Device Is Logged In\\\" Popup\\n- **When:** Login check finds that this device\u2019s **active session** was taken over by another device (heartbeat was alive when takeover occurred). **Not shown** if this device was already closed / session expired \u2014 in that case, the device simply loads the latest server state silently.\\n- **What:** Blocking modal with dimmed overlay.\\n- **Copy:** **\\\"Another device is logged in. Re-login to get your last known progress.\\\"** (copy TBD with Dean.)\\n- **Buttons:** **\\\"Re-login\\\"** (claims session, loads latest server state) \u2022 optional secondary **\\\"Exit\\\"**.\\n- **Behavior:** Cannot be dismissed by tapping outside. Player must act.\\n## Nothing Else\\nNo lobby badge, no connect/disconnect button, no settings toggle, no login screen, no error popups beyond the above.\\n---\\n# 11. Configuration\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Parameter**</td>\\n<td>**Default**</td>\\n<td>**Notes**</td>\\n</tr>\\n<tr>\\n<td>**`multi_device_sync_enabled`**</td>\\n<td>true</td>\\n<td>**Feature flag.** Server-side kill switch for cross-device sync (Game Center / Google Play binding). When false: no platform binding, no login check, no \\\"Another Device\\\" popup. **Cloud save of game state still works** \u2014 only the multi-device sync layer is disabled. Users can\u2019t share progress across devices.</td>\\n</tr>\\n<tr>\\n<td>`save_interval_seconds`</td>\\n<td>5</td>\\n<td>Seconds between auto-saves during gameplay</td>\\n</tr>\\n<tr>\\n<td>`heartbeat_interval_seconds`</td>\\n<td>10</td>\\n<td>Seconds between session heartbeats</td>\\n</tr>\\n<tr>\\n<td>`session_stale_threshold_seconds`</td>\\n<td>3</td>\\n<td>Seconds without heartbeat before session is stale. Short (2\u20134s) so a second device can quickly detect the first is inactive.</td>\\n</tr>\\n<tr>\\n<td>`save_retry_intervals`</td>\\n<td>5s \u2192 10s \u2192 20s \u2192 60s (capped)</td>\\n<td>Exponential backoff for save/connection failures</td>\\n</tr>\\n<tr>\\n<td>`save_retry_max_attempts`</td>\\n<td>5</td>\\n<td>After this many failures \u2192 increase local save frequency as backup</td>\\n</tr>\\n<tr>\\n<td>`state_version_buckets`</td>\\n<td>See Section 6.1</td>\\n<td>Maps app versions to `state_version_id` buckets. Same-bucket versions sync freely. See Section 6.1.</td>\\n</tr>\\n<tr>\\n<td>`current_state_version_id`</td>\\n<td>1</td>\\n<td>The active bucket. Devices on a different bucket must update (forced update popup). See Section 6.1.</td>\\n</tr>\\n<tr>\\n<td>`state_version_overrides`</td>\\n<td>\\\\{\\\\} (empty)</td>\\n<td>**Emergency override.** Map of app_version \u2192 state_version_id. Takes precedence over `state_version_buckets`. Format: `{ \\\"0.38.220\\\": 2, \\\"0.38.230\\\": 2, \\\"0.39.100\\\": 3 }`. Use when a version shipped with the wrong bucket.</td>\\n</tr>\\n<tr>\\n<td>`cloud_save_excluded_versions`</td>\\n<td>\\\\[\\\\] (empty)</td>\\n<td>Specific versions to exclude (known-broken builds). Triggers server alert. See Section 6.1.</td>\\n</tr>\\n<tr>\\n<td></td>\\n<td></td>\\n<td></td>\\n</tr>\\n</table>\\n### In-App Soft Update (separate system \u2014 Firebase Remote Config)\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Key**</td>\\n<td>**Default**</td>\\n<td>**Notes**</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_enabled`</td>\\n<td>false</td>\\n<td>Global kill switch for soft update prompt</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_min_version`</td>\\n<td>\u2014</td>\\n<td>users below this see the soft prompt</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_target_version`</td>\\n<td>\u2014</td>\\n<td>Version shown in dialog copy (iOS)</td>\\n</tr>\\n<tr>\\n<td>`update_prompt_cooldown_hours`</td>\\n<td>24</td>\\n<td>Hours between re-prompts after user taps \\\"Later\\\"</td>\\n</tr>\\n</table>\\n---\\n# 12. Analytics & BI Events\\n## Super Properties\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Property**</td>\\n<td>**Type**</td>\\n<td>**Values**</td>\\n<td>**When Set**</td>\\n</tr>\\n<tr>\\n<td>`cloud_save_platform`</td>\\n<td>String</td>\\n<td>`game_center`, `google_play`, `none`</td>\\n<td>Every app launch after platform detection</td>\\n</tr>\\n<tr>\\n<td>`previous_distinct_id`</td>\\n<td>String/null</td>\\n<td>Previous distinct_id on this device</td>\\n<td>When distinct_id changes</td>\\n</tr>\\n<tr>\\n<td>`connected_devices`</td>\\n<td>int</td>\\n<td>number of connected devices<br>increased or decreased based on the connected devices</td>\\n<td>first connection / disconnection to the game center / google play</td>\\n</tr>\\n</table>\\n## Existing Event Additions\\n### `impression_scapes` (lobby load)\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Param**</td>\\n<td>**Type**</td>\\n<td>**Values**</td>\\n<td>**Logic**</td>\\n</tr>\\n<tr>\\n<td>`cloud_save_connected`</td>\\n<td>Boolean</td>\\n<td>1 / 0</td>\\n<td>**Derived from ****`cloud_save_platform`**** super property.** 1 if `cloud_save_platform` \u2260 `none`; 0 if `none`. Kept on `impression_scapes` for backward compatibility; not needed as a separate super property since `cloud_save_platform` covers all cases.</td>\\n</tr>\\n<tr>\\n<td>`cloud_save_platform`</td>\\n<td>String</td>\\n<td>`game_center`, `google_play`, `null`</td>\\n<td>Platform used</td>\\n</tr>\\n</table>\\n## New Events\\n### 12.1 Connection Flow\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_connection_attempt`</td>\\n<td>System attempts Game Center / Google Play connect on launch</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_connection_success`</td>\\n<td>Platform account detected and linked</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_connection_failure`</td>\\n<td>Connection fails</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_binding_check_failed`</td>\\n<td>Server binding check fails after successful local login</td>\\n</tr>\\n<tr>\\n<td>`impression_cloud_save_sync_toast`</td>\\n<td>One-time sync toast shown</td>\\n</tr>\\n<tr>\\n<td>`impression_cloud_save_signed_in_toast`</td>\\n<td>Signed-in toast shown on return from background (Figma #2, 1s auto-dismiss)</td>\\n</tr>\\n</table>\\n### 12.2 State Sync Flow\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n<td>**Params**</td>\\n</tr>\\n<tr>\\n<td>`technical_state_load`</td>\\n<td>State loaded from cloud during login</td>\\n<td>`state_version`, `state_version_id`</td>\\n</tr>\\n<tr>\\n<td>`technical_state_load_failure`</td>\\n<td>State load fails</td>\\n<td>`error_code`, `error_message`</td>\\n</tr>\\n<tr>\\n<td>`technical_state_login_check`</td>\\n<td>Login check run on app open / background return</td>\\n<td>`current_login_device_id_matches` (1/0), `action` (load_state / show_relogin_popup / take_ownership / claim_new_session), `platform`, `state_version_id`, `current_state_version_id`</td>\\n</tr>\\n<tr>\\n<td>`impression_cloud_save_relogin_popup`</td>\\n<td>\\\"Another device is logged in\\\" popup shown (Figma #9)</td>\\n<td>`previous_owner_device_id`, `current_owner_device_id`, `trigger` (app_open / background_return / offline_reconnect)</td>\\n</tr>\\n<tr>\\n<td>`click_cloud_save_relogin_popup_exit`</td>\\n<td>Player taps \\\"Exit\\\" on the \\\"Another device\\\" popup (optional secondary button)</td>\\n<td>`click_id`</td>\\n</tr>\\n<tr>\\n<td>`click_cloud_save_relogin_popup_relogin`</td>\\n<td>Player taps \\\"Re-login\\\" on the \\\"Another device\\\" popup</td>\\n<td>`click_id`</td>\\n</tr>\\n<tr>\\n<td>`technical_state_corruption_detected`</td>\\n<td>Corrupted state found</td>\\n<td>`corrupted_state` (local / cloud / both), `resolution` (cloud_loaded / local_kept / backup_loaded / support_ticket_created)</td>\\n</tr>\\n<tr>\\n<td>`technical_purchase_restore`</td>\\n<td>IAP purchases restored during sync</td>\\n<td>`restored_items_count` </td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_schema_migration`</td>\\n<td>State blob required schema migration</td>\\n<td>`from_version`, `to_version`, `success`, `fallback_action` (if failed)</td>\\n</tr>\\n</table>\\n### 12.3 State Save Flow\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n<td>**Params**</td>\\n</tr>\\n<tr>\\n<td>`technical_state_save_failure`</td>\\n<td>Cloud save fails during gameplay</td>\\n<td>`error_code`, `error_message`, `consecutive_failures`</td>\\n</tr>\\n<tr>\\n<td>`technical_state_save_conflict`</td>\\n<td>Save rejected (409 \u2014 another device saved between reads)</td>\\n<td>`expected_timestamp`, `actual_timestamp`, `resolution` (retry / show_relogin_popup)</td>\\n</tr>\\n</table>\\n### 12.4 Offline Flow\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n<td>**Params**</td>\\n</tr>\\n<tr>\\n<td>`impression_cloud_save_offline_toast`</td>\\n<td>Offline toast shown (mid-session or background return while offline)</td>\\n<td>`trigger` (connection_lost / return_from_background)</td>\\n</tr>\\n<tr>\\n<td>`click_cloud_save_offline_toast_dismiss`</td>\\n<td>User taps X on offline toast (if dismissible \u2014 see Section 10 for behavior)</td>\\n<td>`click_id`</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_back_online`</td>\\n<td>Reconnects + first successful save</td>\\n<td>`local_saves_during_offline`</td>\\n</tr>\\n</table>\\n### 12.5 Update Prompt Flow (Version Mismatch)\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n<td>**Params**</td>\\n</tr>\\n<tr>\\n<td>`impression_cloud_save_update_popup`</td>\\n<td>Update prompt popup appears \u2014 version out of range (Figma #3)</td>\\n<td>`required_version_min`, `required_version_max`, `trigger` (app_launch / return_from_background), `state_version_id`, `current_state_version_id`</td>\\n</tr>\\n<tr>\\n<td>`click_cloud_save_update_popup_update`</td>\\n<td>user taps \\\"Update Now\\\"</td>\\n<td>`required_version_min`, `required_version_max`, `click_id`</td>\\n</tr>\\n</table>\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Event**</td>\\n</tr>\\n<tr>\\n<td>`required_version_min`, `required_version_max`, `click_id`</td>\\n</tr>\\n</table>\\n### 12.6 Version Pool Events\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_version_disconnected`</td>\\n<td>Version falls outside supported range. Fires when update prompt is triggered.</td>\\n</tr>\\n<tr>\\n<td>`click_cloud_save_update_confirm_back`</td>\\n<td>Player tapped \\\"Back\\\" in the confirmation \u2192 returns to update prompt</td>\\n</tr>\\n</table>\\n### 12.7 Multi-Device / Heartbeat\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n<td>**Params**</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_heartbeat_conflict`</td>\\n<td>Heartbeat detects another device</td>\\n<td></td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_forced_relogin`</td>\\n<td>Device completed re-login after seeing \\\"Another device is logged in\\\" popup.</td>\\n<td>`trigger` (app_open / background_return / offline_reconnect / session_taken_over_by_other_device), `previous_owner_device_id`, `new_owner_device_id`</td>\\n</tr>\\n</table>\\n### 12.8 Platform Disconnect / Reconnect\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n<td>**Params**</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_platform_disconnect`</td>\\n<td>Platform account signed out</td>\\n<td>`detection_method` (app_launch / mid_session), `previous_distinct_id`, `new_distinct_id`</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_platform_reconnect`</td>\\n<td>Same platform account signed back in</td>\\n<td>`platform_account_id`, `previous_distinct_id`, `new_distinct_id`</td>\\n</tr>\\n</table>\\n<callout icon=\\\"\ud83d\udea7\\\" color=\\\"yellow_bg\\\">\\n\\t**POST MVP:** Account switching (signing into a different platform account) is not in MVP.\\n</callout>\\n### 12.9 Reinstall / New Device\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n\\n<tr>\\n<td>**Event**</td>\\n<td>**Trigger**</td>\\n<td>**Params**</td>\\n</tr>\\n<tr>\\n<td>`technical_cloud_save_restore`</td>\\n<td>Cloud save restored on new device/reinstall (tutorial /td>\\n<td>BG return, same session</td>\\n<td>Brief toast, 1s</td>\\n<td>Signed-In Toast</td>\\n<td>#2</td>\\n<td>Login check passes</td>\\n</tr>\\n<tr>\\n<td>5</td>\\n<td>Return from BG, active session taken over</td>\\n<td>BG return within session threshold, another device claimed</td>\\n<td>Blocking popup</td>\\n<td>\\\"Another Device\\\" Popup</td>\\n<td>#9 NEW</td>\\n<td>Login check fails \u2192 re-login</td>\\n</tr>\\n<tr>\\n<td>6</td>\\n<td>Reinstall, cloud exists, version OK</td>\\n<td>Fresh install, signed in</td>\\n<td>Skip FTUE + toast</td>\\n<td>Welcome Back Toast</td>\\n<td>#6</td>\\n<td>Restore from server</td>\\n</tr>\\n<tr>\\n<td>7</td>\\n<td>Reinstall, version NOT OK</td>\\n<td>Fresh install, out of range</td>\\n<td>Update Popup</td>\\n<td>Forced Update Popup</td>\\n<td>#3 + #7 NEW</td>\\n<td>Version check fails</td>\\n</tr>\\n<tr>\\n<td>8</td>\\n<td>Reinstall, no cloud save</td>\\n<td>Fresh install, no state</td>\\n<td>Standard FTUE</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Normal fresh start</td>\\n</tr>\\n<tr>\\n<td>9</td>\\n<td>Version mismatch + 2+ devices \u2192 forced update</td>\\n<td>state_version_id mismatch + multi-device</td>\\n<td>Forced Update Popup \u2014 only \\\"Update Now\\\"</td>\\n<td>Forced Update Popup</td>\\n<td>#3</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>10</td>\\n<td>Version mismatch + single device \u2192 soft toast</td>\\n<td>state_version_id mismatch, 1 device only</td>\\n<td>Dismissible soft update toast</td>\\n<td>Soft Update Toast</td>\\n<td>#3 + #7 NEW</td>\\n<td>\u2014</td>\\n</tr>\\n<tr>\\n<td>11</td>\\n<td>Newer version, same state_version_id</td>\\n<td>Non-breaking update available</td>\\n<td>Dismissible soft update toast</td>\\n<td>Soft Update Toast</td>\\n<td>\u2014</td>\\n<td>Normal gameplay, toast after cooldown</td>\\n</tr>\\n<tr>\\n<td>12</td>\\n<td>Connection drops mid-session</td>\\n<td>Internet lost</td>\\n<td>Persistent toast</td>\\n<td>Offline Toast (new copy)</td>\\n<td>#4 updated</td>\\n<td>Session becomes stale</td>\\n</tr>\\n<tr>\\n<td>13</td>\\n<td>Connection restored, still owner</td>\\n<td>Internet back, no takeover</td>\\n<td>Toast disappears</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Push local state</td>\\n</tr>\\n<tr>\\n<td>14</td>\\n<td>Connection restored, session taken</td>\\n<td>Internet back, taken over</td>\\n<td>Blocking popup</td>\\n<td>\\\"Another Device\\\" Popup</td>\\n<td>#9 NEW</td>\\n<td>Login check fails \u2192 re-login</td>\\n</tr>\\n<tr>\\n<td>15</td>\\n<td>Sequential device switch (A\u2192B\u2192A)</td>\\n<td>Close A, open B, close B, open A</td>\\n<td>Seamless \u2014 loads latest server state</td>\\n<td>No popup (Signed-In Toast)</td>\\n<td>#9 NEW</td>\\n<td>Session transfers each login</td>\\n</tr>\\n<tr>\\n<td>16</td>\\n<td>Both devices active simultaneously</td>\\n<td>Both have active sessions</td>\\n<td>Popup on device whose active session was taken</td>\\n<td>\\\"Another Device\\\" Popup</td>\\n<td>#9 NEW</td>\\n<td>Later login wins</td>\\n</tr>\\n<tr>\\n<td>17</td>\\n<td>Family sharing one account</td>\\n<td>Same as #16</td>\\n<td>Same as #16</td>\\n<td>\\\"Another Device\\\" Popup</td>\\n<td>#9 NEW</td>\\n<td>One device at a time</td>\\n</tr>\\n<tr>\\n<td>18</td>\\n<td>OS platform sign-out</td>\\n<td>Settings sign-out</td>\\n<td>Nothing (silent)</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>New distinct_id, sync stops</td>\\n</tr>\\n<tr>\\n<td>19</td>\\n<td>OS sign back in (same)</td>\\n<td>Settings sign-in</td>\\n<td>Nothing (silent)</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Load server state (no merge)</td>\\n</tr>\\n<tr>\\n<td>20</td>\\n<td>Local save corrupted</td>\\n<td>Checksum fail</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Cloud state loaded</td>\\n</tr>\\n<tr>\\n<td>21</td>\\n<td>Cloud save corrupted</td>\\n<td>Server checksum fail</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>R&D investigation</td>\\n</tr>\\n<tr>\\n<td>22</td>\\n<td>Both corrupted</td>\\n<td>Both fail</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Support ticket created</td>\\n</tr>\\n<tr>\\n<td>23</td>\\n<td>Server unreachable after bind</td>\\n<td>API timeout</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Retry backoff</td>\\n</tr>\\n<tr>\\n<td>24</td>\\n<td>409 conflict on save</td>\\n<td>Concurrent write</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Re-fetch + login check</td>\\n</tr>\\n<tr>\\n<td>25</td>\\n<td>Schema migration needed</td>\\n<td>Older schema on server</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Auto migration</td>\\n</tr>\\n<tr>\\n<td>26</td>\\n<td>Schema newer than client</td>\\n<td>Server schema too new</td>\\n<td>Update Popup</td>\\n<td>Same as #7</td>\\n<td>#3 + #7 NEW</td>\\n<td>Routed to Flow 4</td>\\n</tr>\\n<tr>\\n<td>27</td>\\n<td>Google Play Services missing</td>\\n<td>No play services</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Guest mode</td>\\n</tr>\\n<tr>\\n<td>28</td>\\n<td>Routine launch, still owner</td>\\n<td>Normal app open</td>\\n<td>Nothing</td>\\n<td>\u2014</td>\\n<td>\u2014</td>\\n<td>Login check, load state</td>\\n</tr>\\n</table>\\n---\\n# 14. QA Test Cases\\n<callout icon=\\\"\u2705\\\" color=\\\"green_bg\\\">\\n\\t**27 test cases** across 8 modules. Full sheet: [Cloud Save QA Tab](https://docs.google.com/spreadsheets/d/1aaxQOwE9OSOkbygNk9ZqHD_rTHlONkBBufRa-Vj4CG4/edit?gid=257367855#gid=257367855)\\n\\tQA lead fills verdict columns per version. Seed cases below; full matrix populated upon PRD approval.\\n</callout>\\n### Coverage Summary\\n<table fit-page-width=\\\"true\\\" header-row=\\\"true\\\">\\n<tr>\\n<td>**Module**</td>\\n<td>**Cases**</td>\\n<td>**P0 (Critical)**</td>\\n</tr>\\n<tr>\\n<td>Flow 1 \u2014 First Launch</td>\\n<td>4</td>\\n<td>3</td>\\n</tr>\\n<tr>\\n<td>Flow 2 \u2014 Return from BG</td>\\n<td>2</td>\\n<td>2</td>\\n</tr>\\n<tr>\\n<td>Flow 3 \u2014 Reinstall</td>\\n<td>2</td>\\n<td>1</td>\\n</tr>\\n<tr>\\n<td>**Flow 4 \u2014 Forced Update (headline)**</td>\\n<td>**7**</td>\\n<td>**7**</td>\\n</tr>\\n<tr>\\n<td>Flow 5 \u2014 Offline</td>\\n<td>3</td>\\n<td>3</td>\\n</tr>\\n<tr>\\n<td>Flow 6 \u2014 Multi-Device</td>\\n<td>3</td>\\n<td>2</td>\\n</tr>\\n<tr>\\n<td>Flow 7 \u2014 Platform Sign-Out</td>\\n<td>2</td>\\n<td>2</td>\\n</tr>\\n<tr>\\n<td>Edge Cases + Performance</td>\\n<td>5</td>\\n<td>2</td>\\n</tr>\\n<tr>\\n<td>**Total**</td>\\n<td>**27**</td>\\n<td>**21**</td>\\n</tr>\\n</table>\\n# 15. Project Links\\n<page url=\\\"https://www.notion.so/33bc2344a7dc8193a16ec6374ce07b9a\\\">Repository System \u00d7 Game Center Cloud Save \u2014 Gap Analysis</page>\\n**Jira:** [MC-2689](https://peerplay-games.atlassian.net/browse/MC-2689)\\n**Related docs:**\\n-  \u2014 In-App Soft Update Prompt (separate system)\\n-  \u2014 FB/Apple Connect PRD (same comparison logic, same state management infrastructure)\\n**Platform docs:**\\n- [Game Center overview (Apple)](https://developer.apple.com/game-center/)\\n- [Play Games Services v2 (Google)](https://developers.google.com/games/services/android/quickstart)\\n[https://dotan-peleh.github.io/cloud-save-prd-qa/?v=7](https://dotan-peleh.github.io/cloud-save-prd-qa/?v=7)\\n";

const SYSTEM=`You are "The Brief" — a Q&A assistant for the Merge Cruise Game Center & Google Play PRD (Game Center & Google Play).

Your ONLY knowledge source is the PRD below. Answer based ONLY on what is in the PRD. If something is not covered, say "This isn't defined in the PRD" and suggest it may need to be added.

Guidelines:
- Be concise and clear
- Use bullet points and short paragraphs
- Reference section numbers when relevant (e.g. "See Section 5")
- If the answer involves a flow, walk through the steps briefly
- Use **bold** for key terms and backticks for field names or event names
- Keep answers focused — extract what's relevant, don't dump entire sections
- When referencing a section within this PRD, do NOT use links. Just write "See **Section 5**" or "(Section 6.2)" in bold. The user can search in Notion with Ctrl+F.
- When referencing a SEPARATE document, use a clickable link:
  - [Cloud Save User Flows](https://www.notion.so/peerplay/326c2344a7dc81839551e580629d3ec2)
  - [Complete PRD + Gap Analysis](https://www.notion.so/peerplay/321c2344a7dc81319ac8e241d363dcab)
  - [In-App Update Prompt Guide](https://www.notion.so/peerplay/328c2344a7dc818abfeacb7b7e9907e6)
